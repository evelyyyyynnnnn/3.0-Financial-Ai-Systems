headline: A Deep Q-Network allocation agent over five ETFs, released with its
  performance metrics withheld because the train/test split was never applied.
description: >
  Allocates daily across SPY, QQQ, IWM, GLD and TLT from a 30-day observation
  window, with a 0.001 per-trade cost. The trained agent is released as a
  reproducible artefact (models/dqn_sb3.zip), but its performance figures are
  not reported as evaluation results: `config['data']['train_test_split']` was
  declared in every YAML config and read by no code, so the environment loaded
  the whole 2010-2023 series and `evaluate()` scored the agent on the same data
  it trained on. The numbers that exist are training-set scores.

#      read by no code, so PortfolioEnv loaded the whole 2010-2023 series and
#      evaluate() built the same environment. These figures are therefore
#      training-set scores, not held-out evaluation."
#
#   For the record, the in-sample figures are Sharpe -0.3525, Sortino -0.4542,

modelRisks:
  - No performance claim is made or should be inferred. The agent was evaluated
    on its own training data; any comparison against the baselines below would
    be invalid.
  - Trained for 2,000 timesteps, which is short. Even a clean out-of-sample
    score from this run should not be read as a converged result.
  - Five US ETFs over one 2010-2023 window. No other market, period or asset
    class was tested.
evaluationMetrics:

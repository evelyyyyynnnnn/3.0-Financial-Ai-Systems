# NOTE: this file must stay at the repository root under .github/workflows/.
# GitHub Actions only reads workflows from that path — a copy nested inside a
# project subfolder is silently ignored and never runs.

name: Refresh portfolio data

on:
  schedule:
    # 09:00 UTC on the 1st of every month. 13F filings update quarterly, so
    # monthly is already ahead of the source; tighten only if the Notion
    # database is edited more often than that.
    - cron: "0 9 1 * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the GitHub UI on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run refresh script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/refresh_data.py

      - name: Commit and push if data.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- project-1/giant-portfolio/data.json; then
            echo "No changes to data.json — nothing to commit."
          else
            git add project-1/giant-portfolio/data.json
            git commit -m "chore: refresh portfolio data $(date -u +'%Y-%m-%d')"
            git push
          fi

# Must stay at the repository root — GitHub Actions only reads workflows here.
#
# Manual only, deliberately. Two reasons this is not on a schedule:
#
#   1. The default run (`python -m src.demo`) scores an authored corpus and is
#      deterministic — a monthly commit of it would change only a timestamp.
#   2. The real run has never been performed. docs/DATA.md records the scale as
#      "not yet run", and results/README.md requires a dated run-log entry for
#      any figure that gets cited. A cron that starts committing real pulls
#      before a person has done one and logged it inverts that order.
#
# Run it from the Actions tab when you want a real pull. GitHub's runners can
# reach www.sec.gov, which is the point: local networks often cannot.
name: Refresh filing intelligence

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download filings already in the cache"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2-filing-intelligence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the real 10-K filings from EDGAR
        env:
          # SEC's fair-access policy requires a User-Agent naming a real
          # contact. Set DATAKIT_UA as a repository secret, e.g.
          # "Jane Doe jane@example.com" — without it EDGAR answers 403.
          DATAKIT_UA: ${{ secrets.DATAKIT_UA }}
        run: |
          if [ "${{ inputs.refresh }}" = "true" ]; then
            python -m data.fetch --refresh
          else
            python -m data.fetch
          fi

      - name: Verify the cache against its manifest
        run: python -m data.fetch --verify

      - name: Diff the real filings
        run: python -m src.demo --real

      - name: Commit if the results changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the results are committed. The fetched documents stay out of
          # the repository by data/.gitignore, per this project's own rule on
          # never committing raw source data.
          if git diff --quiet -- results/latest-real.json; then
            echo "No change to results/latest-real.json — nothing to commit."
          else
            git add results/latest-real.json
            git commit -m "chore: refresh filing intelligence $(date -u +'%Y-%m-%d')"
            git push
          fi

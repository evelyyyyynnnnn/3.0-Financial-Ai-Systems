<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giant Portfolio Tracker</title>
<style>
/* Leaflet loaded lazily — see loadLeaflet() */
:root{
  --teal:#0f4c5c;--teal-hi:#1a6b80;--teal-soft:#e8f4f7;
  --bg:#f0f2f5;--sur:#fff;--bdr:#e2e8f0;--bdr2:#cbd5e1;
  --txt:#1a202c;--txt2:#4a5568;--mu:#718096;
  --grn:#16a34a;--grn-bg:#e8f7ee;--red:#c53030;--red-bg:#fff5f5;
  --sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 12px rgba(0,0,0,.10);
  --r:10px;
}
[data-theme=dark]{
  --bg:#0d1117;--sur:#161b22;--bdr:#21262d;--bdr2:#30363d;
  --txt:#e6edf3;--txt2:#8b949e;--mu:#8b949e;--teal-soft:#0d2b33;
  --sh:0 1px 3px rgba(0,0,0,.3);--sh2:0 4px 12px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none}
a{color:var(--teal);text-decoration:none}

/* HEADER */
.H{background:var(--sur);border-bottom:1px solid var(--bdr);height:48px;padding:0 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:500;box-shadow:var(--sh)}
.logo{width:33px;height:33px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.sn{font-size:16px;font-weight:800;color:var(--txt);letter-spacing:-.04em;white-space:nowrap}
.Hr{margin-left:auto;display:flex;align-items:center;gap:7px;flex-shrink:0}
.Hm{font-size:11px;color:var(--mu);white-space:nowrap;display:flex;align-items:center;gap:4px}
.ld{width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}
.hb{padding:4px 11px;border-radius:6px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--bdr);color:var(--txt2);transition:.15s;white-space:nowrap}
.hb:hover{border-color:var(--teal);color:var(--teal)}
.hb.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* TOOLBAR */
.T{background:var(--sur);border-bottom:1px solid var(--bdr);padding:8px 18px;display:flex;align-items:center;gap:7px;overflow-x:auto}
.sw{flex:1;min-width:150px;max-width:320px;position:relative;flex-shrink:0}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:12px;pointer-events:none}
.si-i{width:100%;background:var(--bg);border:1px solid var(--bdr2);border-radius:7px;padding:6px 9px 6px 28px;font-size:12.5px;color:var(--txt);outline:none;font-family:inherit}
.si-i:focus{border-color:var(--teal)}
.si-i::placeholder{color:var(--mu)}
.tdiv{width:1px;height:22px;background:var(--bdr2);flex-shrink:0}
/* filter toggles */
.FG{display:flex;background:var(--bg);border:1px solid var(--bdr2);border-radius:7px;overflow:hidden;flex-shrink:0}
.FB{padding:5px 13px;font-size:12px;font-weight:600;color:var(--txt2);transition:.15s;white-space:nowrap}
.FB.on{background:var(--teal);color:#fff}
/* view buttons */
.VB{padding:5px 13px;border-radius:7px;background:var(--bg);border:1px solid var(--bdr2);font-size:12px;font-weight:600;color:var(--txt2);transition:.15s;white-space:nowrap;flex-shrink:0}
.VB.on{background:var(--teal);color:#fff;border-color:var(--teal)}

/* CONTENT */
.C{padding:14px 18px 80px;max-width:100%;overflow-x:hidden}

/* INVESTOR CARDS */
.IG{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.IC{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:.15s;min-width:0;overflow:hidden}
.IC:hover{box-shadow:var(--sh2);border-color:var(--teal-hi);transform:translateY(-1px)}
.ic-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:2px}
.ic-n{font-size:13px;font-weight:800;color:var(--txt);letter-spacing:-.02em;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ic-rk{font-size:10.5px;font-weight:700;color:var(--mu);background:var(--bg);border-radius:4px;padding:2px 6px;flex-shrink:0}
.ic-s{font-size:11px;color:var(--mu);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-m{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:9px}
.im{min-width:0}
.iml{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.imv{font-size:13px;font-weight:800;color:var(--txt);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imv.t{color:var(--teal)}.imv.g{color:var(--grn)}.imv.r{color:var(--red)}
.mb{height:4px;border-radius:3px;display:flex;overflow:hidden;background:var(--bdr);margin-bottom:9px}
.ms{height:100%}
.hp{display:flex;align-items:center;gap:3px;font-size:11px;min-width:0}
.hpd{width:6px;height:6px;border-radius:1px;flex-shrink:0}
.hpn{color:var(--txt2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hpp{color:var(--mu);font-weight:600;white-space:nowrap;font-size:10.5px;flex-shrink:0}
.ST{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px}
.st{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--teal-soft);color:var(--teal)}
.icf{display:flex;align-items:center;justify-content:space-between;gap:6px}
.vl{font-size:11px;font-weight:700;color:var(--teal);white-space:nowrap}
.vl:hover{text-decoration:underline}

/* STATS */
.SR{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.SC{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:13px 15px;box-shadow:var(--sh)}
.scl{font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.scv{font-size:22px;font-weight:900;color:var(--txt);letter-spacing:-.04em}

/* HOLDING ROWS */
.HR{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;margin-bottom:7px;overflow:hidden}
.HRH{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;min-width:0}
.HRH:hover{background:var(--bg)}
.hrk{font-size:12.5px;font-weight:800;color:var(--mu);min-width:22px;flex-shrink:0}
.hrn{flex:1;font-size:13px;font-weight:800;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hrt{font-size:11px;font-weight:700;color:var(--teal);font-family:monospace;margin-left:6px;flex-shrink:0}
.hp2{background:var(--teal);color:#fff;font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 8px;flex-shrink:0}
.hrv{font-size:13px;font-weight:800;text-align:right;min-width:65px;font-variant-numeric:tabular-nums;flex-shrink:0}
.hrc{color:var(--mu);font-size:10px;transition:.2s;flex-shrink:0}
.HR.open .hrc{transform:rotate(180deg)}
.HRB{display:none;padding:0 14px 11px;border-top:1px solid var(--bdr)}
.HR.open .HRB{display:block}
.hbm{display:flex;gap:12px;padding:7px 0 9px;font-size:11px;color:var(--mu);flex-wrap:wrap;border-bottom:1px solid var(--bdr);margin-bottom:7px}
.IT{display:flex;flex-wrap:wrap;gap:4px}
.it{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--txt2);border:1px solid var(--bdr)}

/* OVERLAY */
.OV{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:44px 14px 14px;overflow-y:auto}
.OV.h{display:none}
.OB{background:var(--sur);border-radius:12px;width:100%;max-width:800px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.oh{padding:15px 20px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ot{font-size:16px;font-weight:800;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis}
.os{font-size:11px;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocl{background:var(--bg);border:1px solid var(--bdr);width:27px;height:27px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--txt2);flex-shrink:0}
.ocl:hover{background:var(--bdr)}
.om{padding:9px 20px;background:var(--bg);border-bottom:1px solid var(--bdr);display:flex;gap:14px;flex-wrap:wrap}
.omi{min-width:0}
.oml{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.omv{font-size:13px;font-weight:800;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.omv.g{color:var(--grn)}.omv.r{color:var(--red)}
/* quarter row */
.QR{display:flex;align-items:center;gap:8px;padding:7px 20px;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.qrl{font-size:9.5px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;flex-shrink:0}
.qrp{background:var(--bg);border:1px solid var(--bdr2);border-radius:5px;padding:3px 7px;font-size:12px;color:var(--txt);outline:none;font-family:inherit}
.qrn{font-size:10.5px;color:var(--mu)}
/* ov tabs */
.OT{display:flex;border-bottom:1px solid var(--bdr);padding:0 20px}
.otb{padding:8px 12px;font-size:12px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent;transition:.12s}
.otb.on{color:var(--teal);border-bottom-color:var(--teal)}
.OBD{padding:15px 20px;max-height:460px;overflow-y:auto}
.nd{background:var(--bg);border:1px dashed var(--bdr2);border-radius:6px;padding:11px 13px;font-size:12px;color:var(--mu)}

/* TABLES */
.tb{width:100%;border-collapse:collapse;font-size:12px}
.tb th{text-align:left;padding:4px 7px;font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--bdr)}
.tb th.r{text-align:right}
.tb td{padding:7px 7px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.tb td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb td.ow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.tb tr:last-child td{border-bottom:none}
.tb tr:hover td{background:var(--bg)}
.tk{font-weight:800;color:var(--teal);font-family:monospace;font-size:11.5px;white-space:nowrap}
.rk{color:var(--mu);font-size:11px;width:20px}
.pb{display:flex;align-items:center;gap:5px;min-width:90px}
.pbt{flex:1;height:4px;background:var(--bdr);border-radius:2px;overflow:hidden;min-width:35px}
.pbf{height:100%;background:var(--teal);border-radius:2px}
.pbl{font-size:11px;font-weight:700;min-width:35px;text-align:right;white-space:nowrap}
.ab,.aa,.ar,.as,.au{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.ab::before,.aa::before,.ar::before,.as::before,.au::before{content:'';width:5px;height:5px;border-radius:50%}
.ab{background:var(--grn-bg);color:var(--grn)}.ab::before{background:var(--grn)}
.aa{background:#e8f0fe;color:#1a56db}.aa::before{background:#1a56db}
.ar{background:var(--red-bg);color:var(--red)}.ar::before{background:var(--red)}
.as{background:var(--red-bg);color:#9b1c1c;opacity:.9}.as::before{background:var(--red)}
.au{background:var(--bg);color:var(--mu)}.au::before{background:var(--mu)}
.ash{margin-bottom:12px}
.ashh{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:4px 0 6px;display:flex;align-items:center;gap:4px}
.app{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--bg);font-weight:700}
.htbl-h{width:100%;border-collapse:collapse;font-size:11.5px}
.htbl-h th{text-align:left;padding:4px 7px;font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--bdr);background:var(--bg)}
.htbl-h td{padding:7px 7px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.htbl-h tr:last-child td{border-bottom:none}
.htk{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;background:var(--teal-soft);color:var(--teal)}
.igr{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px;margin-bottom:11px}
.ic2{background:var(--bg);border-radius:6px;padding:8px 10px;border:1px solid var(--bdr)}
.ic2l{font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.ic2v{font-size:12px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xl{display:flex;flex-wrap:wrap;gap:9px;padding-top:9px;border-top:1px solid var(--bdr);margin-top:2px}
.xtl{font-size:12px;font-weight:700;color:var(--teal)}
.xtl:hover{text-decoration:underline}

/* MAP */
.MW{position:relative;height:calc(100vh - 156px);min-height:430px;border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr)}
#map{width:100%;height:100%}
.ML{position:absolute;bottom:18px;right:10px;background:var(--sur);border:1px solid var(--bdr);border-radius:7px;padding:8px 11px;z-index:400;box-shadow:var(--sh2);font-size:11px}
.lr{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.lr:last-child{margin-bottom:0}
.ld2{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.MP{display:flex;align-items:center;justify-content:center;height:280px;color:var(--mu);font-size:14px;font-weight:600;border:2px dashed var(--bdr2);border-radius:var(--r)}

/* MAP OVERVIEW */
.MO{display:flex;flex-direction:column;gap:20px}
.mot{font-size:14px;font-weight:800;letter-spacing:-.03em;margin-bottom:5px}
.mon{font-size:11.5px;color:var(--mu);margin-bottom:9px;line-height:1.5}
.lrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.lsel{background:var(--sur);border:1px solid var(--bdr2);border-radius:5px;padding:3px 7px;font-size:12px;color:var(--txt);outline:none;font-family:inherit}
.BT{width:100%;border-collapse:collapse;font-size:12px;background:var(--sur);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bdr)}
.BT th{text-align:left;padding:7px 10px;font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--bdr);background:var(--bg)}
.BT th.r{text-align:right}
.BT td{padding:9px 10px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.BT td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.BT td.ow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.BT tr:last-child td{border-bottom:none}
.BT tr:hover td{background:var(--bg)}
.fnc strong{font-size:12.5px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.fnc span{font-size:10.5px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.tk-mark{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:4px;flex-shrink:0;vertical-align:middle}
.MOP{padding:36px;text-align:center;color:var(--mu);font-size:14px;font-weight:600;border:2px dashed var(--bdr2);border-radius:var(--r)}

/* NAME-ROLL */
.NR{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;max-width:880px}
.nrt{font-size:18px;font-weight:900;letter-spacing:-.04em;margin-bottom:5px}
.nrs{font-size:13px;color:var(--mu);margin-bottom:12px;line-height:1.6}
.nrta{width:100%;height:350px;background:var(--sur);border:2px solid var(--bdr2);border-radius:8px;padding:11px 13px;font-size:12.5px;color:var(--txt);font-family:monospace;resize:none;outline:none;line-height:1.7}
.nrta:focus{border-color:var(--teal)}
.nra{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.nrb{padding:7px 15px;border-radius:6px;font-size:12px;font-weight:700;transition:.15s}
.nrb.p{background:var(--teal);color:#fff}
.nrb.p:hover{background:var(--teal-hi)}
.nrb.s{background:var(--bg);border:1px solid var(--bdr2);color:var(--txt2)}
.nrb.s:hover{border-color:var(--teal);color:var(--teal)}
.nri{background:var(--teal-soft);border:1px solid rgba(15,76,92,.2);border-radius:8px;padding:13px 15px;font-size:12.5px;color:var(--teal);line-height:1.8}
.nri code{background:rgba(15,76,92,.12);padding:1px 5px;border-radius:3px;font-size:11px;font-family:monospace}
.nrm{margin-top:9px}
.nrok{background:#e8f7ee;border:1px solid #16a34a;border-radius:7px;padding:9px 13px;font-size:12px;color:#15803d}
.nrwn{background:var(--bg);border:1px solid var(--bdr2);border-radius:7px;padding:9px 13px;font-size:12px;color:var(--mu)}

/* REFERENCES */
.RG{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:900px}
.RC{background:var(--sur);border:1px solid var(--bdr);border-radius:8px;padding:11px 13px;box-shadow:var(--sh)}
.rcn{font-weight:800;font-size:13px;color:var(--teal)}
.rcu{font-size:10px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px;min-width:0}
.rcu-r{display:flex;align-items:baseline;gap:0;flex-wrap:nowrap;min-width:0;overflow:hidden;margin-bottom:4px}
.rcu2{font-size:12px;color:var(--txt);line-height:1.5}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}
@media(max-width:640px){.IG{grid-template-columns:1fr}.SR{grid-template-columns:1fr 1fr}.NR{grid-template-columns:1fr}.RG{grid-template-columns:1fr}.sn{display:none}.Hm{display:none}}
</style>
</head>
<body>

<header class="H">
  <div class="logo">GP</div>
  <div class="sn" id="sn">Giant Portfolio Tracker</div>
  <div class="Hr">
    <button class="hb on" id="bhome" onclick="goHome()" data-en="Home" data-zh="主页">Home</button>
    <button class="hb" id="bnr" onclick="goSp('techdocs')" data-en="Tech Docs" data-zh="技术文档">Tech Docs</button>
    <button class="hb" id="brf" onclick="goSp('refs')" data-en="References" data-zh="数据来源">References</button>
    <div class="Hm"><div class="ld"></div><span id="hi">Loading...</span></div>
    <button class="hb" id="lbtn" onclick="toggleLang()">ZH</button>
    <button class="hb" id="tbtn" onclick="toggleTheme()">Dark</button>
  </div>
</header>

<div class="T">
  <div class="sw"><span class="si">&#9906;</span><input class="si-i" id="srch" type="text" placeholder="Search fund, manager, or company..." oninput="onSrch(this.value)"></div>
  <div class="FG" id="FG">
    <button class="FB" id="fbi" onclick="togF('i')">By Investor</button>
    <button class="FB" id="fbh" onclick="togF('h')">By Holding</button>
  </div>
  <div class="tdiv"></div>
  <button class="VB on" id="vbc" onclick="setV('cards')">Cards</button>
  <button class="VB" id="vbm" onclick="setV('mapov')">Map Overview</button>
  <button class="VB" id="vbg" onclick="setV('geo')">Geographic</button>
</div>

<div class="C" id="C"></div>

<div class="OV h" id="OV" onclick="closeOv(event)">
  <div class="OB" onclick="event.stopPropagation()">
    <div class="oh">
      <div style="min-width:0;flex:1">
        <div class="ot" id="ot"></div>
        <div class="os" id="os"></div>
      </div>
      <button class="ocl" onclick="document.getElementById('OV').classList.add('h')">x</button>
    </div>
    <div class="om" id="om"></div>
    <div class="QR">
      <span class="qrl" id="qrl">Quarter</span>
      <select class="qrp" id="qrp" onchange="onQC()"></select>
      <span class="qrn" id="qrn"></span>
    </div>
    <div class="OT" id="OT"></div>
    <div class="OBD" id="OBD"></div>
  </div>
</div>

<script>
// ============================================================

function t(k){return TL[S.lang][k]||TL.en[k]||k}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fV(v){if(v==null)return'—';if(v>=1e12)return'$'+(v/1e12).toFixed(2)+'T';if(v>=1e9)return'$'+(v/1e9).toFixed(2)+'B';if(v>=1e6)return'$'+(v/1e6).toFixed(1)+'M';return'$'+v.toLocaleString()}
function fS(v){return v==null?'—':Number(v).toLocaleString()}
function fP(v){return v==null?'—':v.toFixed(2)+'%'}
function fPx(v){return v==null?'—':'$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
// SAFE accessor functions — always return string, never undefined
function sN(inv){const nm=(S.lang==='zh'&&inv.name_zh)?inv.name_zh:inv.name||''; const p=nm.split(' - '); return(p.length>=2?p[1].trim():p[0])||nm}
function rN(inv){return (S.lang==='zh'?inv.representative_zh:null)||inv.representative||''}
function cN(inv){return (S.lang==='zh'?inv.characteristic_zh:null)||inv.characteristic||''}
function stN(inv){return ((S.lang==='zh'?inv.strategy_short_zh:null)||inv.strategy_short||'').substring(0,70)}
function qCmp(a,b){
  const na=normQ?normQ(a):a, nb=normQ?normQ(b):b;
  const pa=(na||'').match(/Q(\d)\s+(\d{4})/), pb=(nb||'').match(/Q(\d)\s+(\d{4})/);
  if(!pa||!pb)return 0;
  const d=parseInt(pa[2])-parseInt(pb[2]);return d?d:parseInt(pa[1])-parseInt(pb[1]);
}
function normQ(q){return(q||'').match(/^(\d{4})\s+(Q[1-4])$/)?q.replace(/^(\d{4})\s+(Q[1-4])$/,'$2 $1'):q}
function qOK(inv,q){const e=normQ(inv.earliest_13f_quarter);if(!e||e==='Unknown')return true;return qCmp(q,e)>=0}
function abg(a){const x=(a||'').toLowerCase();
  if(x==='buy'||x==='new buy')return`<span class="ab">${t('aBuy')}</span>`;
  if(x==='add')return`<span class="aa">${t('aAdd')}</span>`;
  if(x==='reduce')return`<span class="ar">${t('aReduce')}</span>`;
  if(x==='sold out'||x==='sell')return`<span class="as">${t('aSold')}</span>`;
  return`<span class="au">${t('aUnch')}</span>`}

function openOv(id,q){
  const inv=S.DATA.investors.find(i=>i.id===id);if(!inv)return;
  S.ovId=id;S.ovQ=q||'Q2 2026';
  // Header
  document.getElementById('ot').textContent=(S.lang==='zh'&&inv.name_zh)?inv.name_zh:inv.name||'';
  // Sub-line: representative + style (never undefined)
  const rep=rN(inv), styles=(inv.investment_style||[]).slice(0,3).join(' / ')||'—';
  document.getElementById('os').textContent=`${rep||'—'} \u00b7 ${styles}`;
  // Meta
  const loc=inv.location||{};
  const locStr=`${loc.city||''}${loc.state?', '+loc.state:''}, ${loc.country||''}`.replace(/^,\s*/,'');
  document.getElementById('om').innerHTML=[
    ['13F AUM',inv.aum_display||'—'],
    ['# Holdings',inv.num_holdings||'?'],
    ['Performance',(inv.performance_1_5y||'').substring(0,45)],
    ['Founded',inv.founded||'—'],
    ['Location',locStr||'—'],
    ['Earliest 13F',inv.earliest_13f_quarter||'—'],
  ].map(([l,v])=>`<div class="omi"><div class="oml">${esc(l)}</div><div class="omv">${esc(String(v))}</div></div>`).join('');
  // Quarter picker
  const qp=document.getElementById('qrp');
  // Generate quarters from Q2 2026 back to investor's earliest filing
  const ear=inv.earliest_13f_quarter;
  const allQKeys=Object.keys(Q_DATES); // all quarters newest first (Q4 2010 format)
  let invQS=allQKeys;
  if(ear&&ear!=='Unknown'){
    // Normalize format: "2010 Q4" → "Q4 2010" to match Q_DATES keys
    const earNorm=ear.match(/^(\d{4})\s+(Q[1-4])$/) ? ear.replace(/^(\d{4})\s+(Q[1-4])$/,'$2 $1') : ear;
    const earIdx=allQKeys.indexOf(earNorm);
    if(earIdx>=0) invQS=allQKeys.slice(0,earIdx+1);
  }
  // Clamp S.ovQ to valid range for this investor
  if(invQS.length>0 && !invQS.includes(S.ovQ)) S.ovQ=invQS[0];
  qp.innerHTML=invQS.map(qq=>`<option value="${esc(qq)}"${qq===S.ovQ?' selected':''}>${qq}</option>`).join('');
  updQNote(inv);
  // Tabs
  document.getElementById('OT').innerHTML=['h','a','hi'].map((tab,i)=>{
    const labs=[t('tab_h'),t('tab_a'),t('tab_hi')];
    return`<button class="otb${i===0?' on':''}" onclick="ovTab('${tab}',this)">${labs[i]}</button>`;
  }).join('');
  rendOvB('h');
  document.getElementById('OV').classList.remove('h');
}

function bOvA(inv,qd){

}

function rMapOv(){
  if(!S.fi&&!S.fh){
    document.getElementById('C').innerHTML=`<div class="MOP">${t('mop')}</div>`;
    return;
  }
  const parts=[];
  if(S.fi)parts.push(bMoInv());
  if(S.fh)parts.push(bMoHold());
  document.getElementById('C').innerHTML=`<div class="MO">${parts.join('')}</div>`;
}

function bMoInv(){
  // Use extended_filers list — ALL 13F institutional investors, not just our 20
  const allF=(S.DATA.map_overview?.all_filers||[]).slice().sort((a,b)=>b.aum-a.aum);
  const lim=S.moLimI||50;
  const shown=allF.slice(0,lim);
  const rows=shown.map((f,i)=>{
    const nm=(S.lang==='zh'&&f.name_zh?f.name_zh:f.name)||'';
    const style=(f.style||[]).join(', ')||'—';
    const tracked=f.tracked?`<span class="tk-mark" title="${t('tracked_label')}"></span>`:'';
    return`<tr><td class="rk">${i+1}</td>
      <td class="fnc">${tracked}<strong title="${esc(nm)}">${esc(nm.substring(0,40))}</strong><span>${esc(f.type||'')}</span></td>
      <td class="r" style="font-size:14px;font-weight:900;color:var(--teal)">${f.aum_d||fV(f.aum)}</td>
      <td class="ow" style="font-size:11px;color:var(--mu);max-width:160px">${esc(style)}</td>
      <td style="font-size:11px;color:var(--mu);white-space:nowrap">${esc(f.earliest||'—')}</td>
      <td style="font-size:10px;color:var(--mu)">${esc(f.source||'')}</td>
    </tr>`;
  }).join('');
  return`<div>
    <div class="mot">${t('moi')}</div>
    <div class="lrow"><span style="font-size:12px;color:var(--mu);font-weight:600">${t('ml')}</span>
      <select class="lsel" id="lim-i" onchange="S.moLimI=this.value==='999'?999:parseInt(this.value);rMapOv()">
        <option value="25"${lim===25?' selected':''}>25</option>
        <option value="50"${lim===50||!S.moLimI?' selected':''}>50</option>
        <option value="100"${lim===100?' selected':''}>100</option>
        <option value="999"${lim===999?' selected':''}>All (${allF.length})</option>
      </select>
      <span style="font-size:11px;color:var(--mu)">${allF.length} total filers &nbsp;|&nbsp; <span style='color:var(--teal);font-weight:700'>&#11044;</span> = tracked (auto-refreshed) &nbsp;|&nbsp; Sources: SEC EDGAR, WhaleWisdom</span>
    </div>
    <p class="mon">${t('mni')}</p>
    <p class="mon" style="margin-bottom:10px">${t('src_note')}</p>
    <div style="overflow-x:auto"><table class="BT"><thead><tr>
      <th>#</th><th>Fund / Institution</th><th class="r">AUM</th><th>${t('cst')}</th><th>${t('cea')}</th><th>Source</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function bMoHold(){
  const lim = S.moLimH || 50;
  const zh = S.lang === 'zh';

  // Get holdings sorted by price — prefer pre-computed list, fallback to live compute
  let all = [];
  if (S.DATA && S.DATA.map_overview && (S.DATA.map_overview.top_holdings_by_price||[]).length) {
    all = S.DATA.map_overview.top_holdings_by_price;
  } else {
    // Build from investor holdings on the fly
    const map = {};
    (S.DATA?.investors||[]).forEach(inv => {
      (inv.holdings||[]).forEach(h => {
        if (!h.ticker) return;
        if (!map[h.ticker]) map[h.ticker] = {ticker:h.ticker, company:h.company, company_zh:h.company_zh, hq_country:h.hq_country, price:h.price, total_value:0, holders:0};
        map[h.ticker].total_value += (h.value || 0);
        map[h.ticker].holders++;
        if (!map[h.ticker].price && h.price) map[h.ticker].price = h.price;
      });
    });
    all = Object.values(map).sort((a, b) => (b.price||0) - (a.price||0));
  }

  const shown = all.slice(0, lim);
  const total = all.length;

  const rows = shown.map((h, i) => {
    const co = (zh && h.company_zh ? h.company_zh : h.company) || '';
    return `<tr>
      <td class="rk">${i+1}</td>
      <td><span class="tk">${esc(h.ticker)}</span></td>
      <td class="ow">${esc(co)}</td>
      <td class="r" style="font-size:14px;font-weight:900;color:var(--txt)">${fPx(h.price)}</td>
      <td class="r">${fV(h.total_value)}</td>
      <td class="r">${h.holders}</td>
      <td style="font-size:11px;color:var(--mu);white-space:nowrap">${esc(h.hq_country||'—')}</td>
    </tr>`;
  }).join('');

  return `<div>
    <div class="mot">${t('moh')}</div>
    <div class="lrow">
      <span style="font-size:12px;color:var(--mu);font-weight:600">${t('ml')}</span>
      <select class="lsel" id="lim-h" onchange="S.moLimH=this.value==='999'?999:parseInt(this.value);rMapOv()">
        <option value="25"${lim===25?' selected':''}>25</option>
        <option value="50"${lim===50||!S.moLimH?' selected':''}>50</option>
        <option value="100"${lim===100?' selected':''}>100</option>
        <option value="999"${lim===999?' selected':''}>All (${total})</option>
      </select>
      <span style="font-size:11px;color:var(--mu)">${total} ${zh?'只持仓':'holdings'} ${zh?'按季末申报价格排序':'sorted by quarter-end reported price'}</span>
    </div>
    <p class="mon">${t('mnh')}</p>
    <div style="overflow-x:auto"><table class="BT"><thead><tr>
      <th>#</th><th>${t('ctk')}</th><th>${t('cco')}</th>
      <th class="r">${zh?'申报价(季末)':'Price (filed)'}</th>
      <th class="r">Combined Value</th>
      <th class="r">${t('cinv')}</th>
      <th>${t('chq')}</th>
    </tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}


function rGeo(){
  if(!S.fi&&!S.fh){
    document.getElementById('C').innerHTML=`<div class="MP">${t('gop')}</div>`;
    return;
  }
  document.getElementById('C').innerHTML=`<div class="MW"><div id="map"></div><div class="ML" id="ML"></div></div>`;
  loadLeaflet().then(()=>buildMap(S.fi,S.fh));

let _leafletLoaded=false;
function loadLeaflet(){
  return new Promise((res)=>{
    if(_leafletLoaded){res();return;}
    const css=document.createElement('link');
    css.rel='stylesheet';
    css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
    document.head.appendChild(css);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload=()=>{_leafletLoaded=true;res()};
    document.head.appendChild(s);
  });
}
function buildMap(showI,showH){
  if(S.map){S.map.remove();S.map=null}
  const m=L.map('map',{center:[30,10],zoom:2});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; <a href="https://www.openstreetmap.org">OpenStreetMap</a>',maxZoom:18}).addTo(m);
  S.map=m;
  const showLines=showI&&showH;
  const iIcon=L.divIcon({className:'',html:'<div style="width:13px;height:13px;border-radius:50%;background:#0f4c5c;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3)"></div>',iconSize:[13,13],iconAnchor:[6,6]});
  const sIcon=L.divIcon({className:'',html:'<div style="width:9px;height:9px;border-radius:50%;background:#e67e22;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)"></div>',iconSize:[9,9],iconAnchor:[4,4]});
  const sPos={};
  S.DATA.investors.forEach(inv=>(inv.holdings||[]).forEach(h=>{if(h.lat&&h.lng)sPos[h.ticker]={lat:h.lat,lng:h.lng,ticker:h.ticker,company:h.company,city:h.hq_city,country:h.hq_country}}));
  if(showI){
    S.DATA.investors.forEach(inv=>{
      const loc=inv.location;if(!loc?.lat||!loc?.lng)return;
      const mk=L.marker([loc.lat,loc.lng],{icon:iIcon}).addTo(m);
      const sty=(inv.investment_style||[]).slice(0,3).join(', ');
      mk.bindPopup(`<div style="min-width:185px;font-size:13px;font-family:system-ui"><b style="font-size:14px">${esc(sN(inv))}</b><br><span style="color:#718096;font-size:11px">${esc(rN(inv)||'')}</span><hr style="margin:5px 0;border-color:#e2e8f0"><b>AUM:</b> ${inv.aum_display||'—'}<br><b>Holdings:</b> ${inv.num_holdings||'?'}<br><b>City:</b> ${esc(loc.city||'')}${loc.state?', '+loc.state:''}<br><b>Country:</b> ${esc(loc.country||'')}<br><b>Earliest 13F:</b> ${esc(inv.earliest_13f_quarter||'—')}<br><b>Style:</b> ${esc(sty||'—')}</div>`);
      if(showLines)(inv.holdings||[]).slice(0,5).forEach(h=>{if(h.lat&&h.lng)L.polyline([[loc.lat,loc.lng],[h.lat,h.lng]],{color:'#0f4c5c',weight:1,opacity:.2,dashArray:'3,5'}).addTo(m)});
    });
  }
  if(showH)Object.values(sPos).forEach(s=>{const mk=L.marker([s.lat,s.lng],{icon:sIcon}).addTo(m);mk.bindPopup(`<div style="min-width:145px;font-size:13px;font-family:system-ui"><b style="font-size:14px">${esc(s.ticker)}</b><br>${esc(s.company||'')}<hr style="margin:5px 0;border-color:#e2e8f0"><b>HQ:</b> ${esc(s.city||'—')}<br><b>Country:</b> ${esc(s.country||'—')}</div>`)});
  let leg=`<div style="font-size:11px;font-weight:700;margin-bottom:5px">Legend</div>`;
  if(showI)leg+=`<div class="lr"><div class="ld2" style="background:#0f4c5c"></div><span>Fund office</span></div>`;
  if(showH)leg+=`<div class="lr"><div class="ld2" style="background:#e67e22"></div><span>Stock HQ</span></div>`;
  if(showLines)leg+=`<div class="lr"><div style="width:18px;border-top:1px dashed #0f4c5c;margin-right:2px"></div><span>Holdings link</span></div>`;
  document.getElementById('ML').innerHTML=leg;
}

"name":"httpx + selectolax","layer":{"zh":"第2层 · HTTP+解析","en":"L2 · HTTP + parse"},"desc":{"zh":"同 01 但解析器换成 C 实现的 lexbor，快 5–10 倍；生态小，遇坑资料少。","en":"Same as 01 but parsing moves to the C lexbor engine — 5–10× faster; smaller ecosystem, fewer answers when stuck."},"when":{"zh":"抓几万页、解析成瓶颈时","en":"Tens of thousands of pages, parsing is the bottleneck"},"ran":true,"status":"RUN","rows_n":10,"js":"✗","elapsed":0.128,"why_not":{"zh":"","en":""},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 02 — httpx + selectolax（静态页最快组合）\n\n算法：\n  1. httpx 发 GET —— 和 requests 同级的 API，但原生支持 HTTP/2 和 async\n  2. selectolax 的 HTMLParser 解析 —— 底层是 C 写的 lexbor 引擎\n  3. css() 选择器定位行，css_first() 取单元格\n\n和方法 01 的唯一区别在解析器：BeautifulSoup 构造的是 Python 对象树，\nselectolax 在 C 层完成解析，只在取值时过一次 Python。页面越大差距越明显，\n实测通常快 5–10 倍。抓几万页时这个差距才值钱；抓十几页没必要换。\n\"\"\"\nimport sys, os, time\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\n\nimport httpx\n# selectolax 1.0 起 modest 后端被弃用，必须用 lexbor（更快，且遵循 HTML5 标准）\nfrom selectolax.lexbor import LexborHTMLParser as HTMLParser\nfrom common import TARGET_LOCAL, save\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\",\n        \"current_price\", \"w52_high\", \"w52_low\"]\n\n\ndef main():\n    t0 = time.time()\n    with httpx.Client(timeout=20, follow_redirects=True) as c:\n        r = c.get(TARGET_LOCAL)\n        r.raise_for_status()\n        html = r.text\n\n    tree = HTMLParser(html)\n    rows = []\n    for tr in tree.css(\"#holdings tbody tr\"):\n        tds = [td.text(strip=True) for td in tr.css(\"td\")]\n        row = dict(zip(COLS, tds))\n        row[\"cusip\"] = tr.attributes.get(\"data-cusip\", \"\")\n        rows.append(row)\n\n    save(HERE, rows, raw=html, raw_ext=\"html\", elapsed=time.time() - t0,\n         extra={\"http_version\": r.http_version},\n         notes=\"与 01 结果完全一致，解析更快；同样看不到 JS 列\")\n\n\nif __name__ == \"__main__\":\n    main()\n =\"holdings\"]/tbody/tr[td[5]=\"Sold Out\"]/td[2]/text()')\n\n    save(HERE, rows, raw=r.text, raw_ext=\"html\", elapsed=time.time() - t0,\n         extra={\"xpath_filter_Buy\": buys, \"xpath_filter_SoldOut\": sold},\n         notes=\"演示了 XPath 按单元格内容筛选（Buy / Sold Out），这是 CSS 选择器做不到的\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"","w52_high":"","w52_low":"","cusip":"037833100"},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"","w52_high":"","w52_low":"","cusip":"084670702"},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"","w52_high":"","w52_low":"","cusip":"02079K305"},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000","current_price":"","w52_high":"","w52_low":"","cusip":"594918104"},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000","current_price":"","w52_high":"","w52_low":"","cusip":"023135106"},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000","current_price":"","w52_high":"","w52_low":"","cusip":"67066G104"},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Corp","pct":"5.62","activity":"Unchanged","shares":"142000000","value":"16820000000","current_price":"","w52_high":"","w52_low":"","cusip":"30231G102"},{"rank":"8","ticker":"JPM","company":"JPMorgan Chase & Co","pct":"4.98","activity":"Buy","shares":"61900000","value":"14900000000","current_price":"","w52_high":"","w52_low":"","cusip":"46625H100"},{"rank":"9","ticker":"KO","company":"Coca-Cola Co","pct":"3.74","activity":"Unchanged","shares":"400000000","value":"11190000000","current_price":"","w52_high":"","w52_low":"","cusip":"191216100"},{"rank":"10","ticker":"PFE","company":"Pfizer Inc","pct":"2.31","activity":"Sold Out","shares":"0","value":"0","current_price":"","w52_high":"","w52_low":"","cusip":"717081103"}],"summary":{"method":"03_lxml_xpath","rows":10,"rows_expected":10,"static_cols_ok":true,"first_row_correct":true,"js_cols_captured":false,"elapsed_s":0.005,"notes":"演示了 XPath 按单元格内容筛选（Buy / Sold Out），这是 CSS 选择器做不到的","ran_at":"2026-10-08 22:38:33","xpath_filter_Buy":["GOOGL","JPM"],"xpath_filter_SoldOut":["PFE"]}},{"key":"04_pandas_read_html","name":"pandas.read_html","layer":{"zh":"第2层 · HTTP+解析","en":"L2 · HTTP + parse"},"desc":{"zh":"一行代码解析整张表，自动识别表头；只认 <table>，拿不到属性。","en":"One line parses the whole table and finds the header; sees only <table>, never attributes."},"when":{"zh":"页面主体就是规整表格","en":"The page body is a clean table"},"ran":true,"status":"RUN","rows_n":10,"js":"✗","elapsed":0.035,"why_not":{"zh":"","en":""},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 04 — pandas.read_html（表格一行搞定）\n\n算法：\n  1. 取回 HTML\n  2. pd.read_html() 自动找出页面里所有 <table>，每个转成一个 DataFrame\n\n这是「页面主体就是一张规整表格」时最省事的办法 —— 一行代码，\n自动处理表头、合并单元格、数值列。缺点是拿不到 <td> 以外的东西\n（比如 data-cusip 这种属性），也无法按属性筛选。\n\n你那个 13F 场景里，如果只要表格本体，这是性价比最高的一条。\n\"\"\"\nimport sys, os, time, io\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\n\nimport requests\nimport pandas as pd\nfrom common import TARGET_LOCAL, save\n\nHERE = os.path.dirname(os.path.abspath(__file__))\n\n\ndef main():\n    t0 = time.time()\n    r = requests.get(TARGET_LOCAL, timeout=20)\n    r.raise_for_status()\n\n    tables = pd.read_html(io.StringIO(r.text))\n    df = tables[0]\n    df.columns = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\",\n                  \"value\", \"current_price\", \"w52_high\", \"w52_low\"]\n    df = df.fillna(\"\")\n\n    rows = [{k: (\"\" if v == \"\" else str(v)) for k, v in rec.items()}\n            for rec in df.to_dict(\"records\")]\n    # pandas 会把整数读成 int，统一成字符串以便和其它方法对齐\n    for row in rows:\n        for k in (\"rank\", \"shares\", \"value\"):\n            if row[k].endswith(\".0\"):\n                row[k] = row[k][:-2]\n        if row[\"pct\"] and \".\" not in row[\"pct\"]:\n            row[\"pct\"] = row[\"pct\"] + \".0\"\n\n    out = os.path.join(HERE, \"output\")\n    os.makedirs(out, exist_ok=True)\n    df.to_csv(os.path.join(out, \"holdings.csv\"), index=False, encoding=\"utf-8-sig\")\n\n    save(HERE, rows, raw=r.text, raw_ext=\"html\", elapsed=time.time() - t0,\n         extra={\"tables_found\": len(tables), \"also_wrote\": \"output/holdings.csv\"},\n         notes=\"一行解析整张表，自动识别表头；但拿不到 data-cusip 这类属性\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"","w52_high":"","w52_low":""},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"","w52_high":"","w52_low":""},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"","w52_high":"","w52_low":""},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000","current_price":"","w52_high":"","w52_low":""},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000","current_price":"","w52_high":"","w52_low":""},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000","current_price":"","w52_high":"","w52_low":""},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Co .abspath(__file__))\nOUT = os.path.join(HERE, \"output\")\nos.makedirs(OUT, exist_ok=True)\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\",\n        \"current_price\", \"w52_high\", \"w52_low\"]\n\n\nclass HoldingsSpider(scrapy.Spider):\n    name = \"holdings\"\n    start_urls = [TARGET_LOCAL]\n    custom_settings = {\n        \"LOG_LEVEL\": \"ERROR\",\n        \"FEEDS\": {os.path.join(OUT, \"scrapy_items.jsonl\"): {\"format\": \"jsonlines\",\n                                                           \"overwrite\": True}},\n        \"DOWNLOAD_DELAY\": 0.1,          # 礼貌限速\n        \"CONCURRENT_REQUESTS\": 4,\n        \"ROBOTSTXT_OBEY\": False,        # 本地靶站没有 robots.txt\n        \"USER_AGENT\": \"crawler-methods-lab/1.0 (educational)\",\n    }\n\n    def parse(self, response):\n        for tr in response.css(\"#holdings tbody tr\"):\n            tds = [t.strip() for t in tr.css(\"td::text\").getall()]\n            tds += [\"\"] * (len(COLS) - len(tds))\n            item = dict(zip(COLS, tds))\n            item[\"cusip\"] = tr.attrib.get(\"data-cusip\", \"\")\n            yield item\n\n\ndef main():\n    t0 = time.time()\n    jl = os.path.join(OUT, \"scrapy_items.jsonl\")\n    if os.path.exists(jl):\n        os.remove(jl)\n\n    proc = CrawlerProcess(settings={\"LOG_LEVEL\": \"ERROR\"})\n    proc.crawl(HoldingsSpider)\n    proc.start()                                   # 阻塞直到爬完\n\n    rows = []\n    if os.path.exists(jl):\n        with open(jl, encoding=\"utf-8\") as f:\n            rows = [json.loads(ln) for ln in f if ln.strip()]\n\n    save(HERE, rows, elapsed=time.time() - t0,\n         extra={\"engine\": \"Scrapy \" + scrapy.__version__,\n                \"feed\": \"output/scrapy_items.jsonl\"},\n         notes=\"框架自带调度/并发/重试/限速；单页场景下这些都用不上\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"22791 ,"elapsed_s":0.464,"notes":"框架自带调度/并发/重试/限速；单页场景下这些都用不上","ran_at":"2026-10-08 22:38:47","engine":"Scrapy 2.19.0","feed":"output/scrapy_items.jsonl"}},{"key":"06_curl_cffi","name":"curl_cffi","layer":{"zh":"第2层 · 反检测","en":"L2 · anti-detection"},"desc":{"zh":"伪装 TLS 握手的 JA3 指纹，过 Cloudflare 一类检测；只解决网络层。","en":"Mimics the JA3 TLS-handshake fingerprint to get past Cloudflare-class checks; fixes the network layer only."},"when":{"zh":"目标站返 403/429 时","en":"When the target returns 403/429"},"ran":true,"status":"RUN","rows_n":10,"js":"✗","elapsed":0.003,"why_not":{"zh":"","en":""},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 06 — curl_cffi（TLS 指纹伪装）\n\n算法：\n  1. curl_cffi 底层用 curl-impersonate 编译的 libcurl\n  2. impersonate=\"chrome\" 让 TLS 握手的 JA3 指纹、HTTP/2 帧顺序、\n     header 顺序全部和真实 Chrome 一致\n  3. 之后的用法和 requests 完全一样\n\n要解决的问题：Cloudflare、Akamai、PerimeterX 这类防护不只看 User-Agent，\n它们看 **TLS 握手指纹**。Python 的 requests 用的是 OpenSSL 默认配置，\n指纹和任何真实浏览器都不一样，一眼就被识别成脚本。\n\n注意：这是「让请求看起来像浏览器」，不是「绕过登录或付费墙」。\n对 SEC 这种无防护的站点完全没必要用；对 Dataroma 这种会返 403/429 的\n二手站，它可能是你唯一能稳定拿到数据的办法 —— 但要先确认对方 ToS 允许。\n\"\"\"\nimport sys, os, time\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\n\nfrom curl_cffi import requests as creq\nfrom selectolax.lexbor import LexborHTMLParser as HTMLParser\nfrom common import TARGET_LOCAL, save\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\",\n        \"current_price\", \"w52_high\", \"w52_low\"]\n\n\ndef main():\n    t0 = time.time()\n    # impersonate 是这个库的全部意义所在\n    r = creq.get(TARGET_LOCAL, impersonate=\"chrome\", timeout=20)\n    r.raise_for_status()\n\n    tree = HTMLParser(r.text)\n    rows = []\n    for tr in tree.css(\"#holdings tbody tr\"):\n        tds = [td.text(strip=True) for td in tr.css(\"td\")]\n        row = dict(zip(COLS, tds))\n        row[\"cusip\"] = tr.attributes.get(\"data-cusip\", \"\")\n        rows.append(row)\n\n    save(HERE, rows, raw=r.text, raw_ext=\"html\", elapsed=time.time() - t0,\n         extra={\"impersonate\": \"chrome\",\n                \"note_on_fingerprint\": \"真实价值在打有反爬的站点时，本地靶站体现不出来\"},\n         notes=\"结果与 01/02 相同；差异在网络层的 TLS 指纹，不在解析层\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"","w52_high":"","w52_low":"","cusip":"037833100"},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"","w52_high":"","w52_low":"","cusip":"084670702"},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"","w52_high":"","w52_low":"","cusip":"02079K305"},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000","current_price":"","w52_high":"","w52_low":"","cusip":"594918104"},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000","current_price":"","w52_high":"","w52_low":"","cusip":"023135106"},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000","current_price":"","w52_high":"","w52_low":"","cusip":"67066G104"},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Corp","pct":"5.62","activity":"Unchanged","shares":"142000000","value":"16820000000","current_price":"","w52_high":"","w52_low":"","cusip":"30231G102"},{"rank":"8","ticker":"JPM","company":"JPMorgan Chase & Co","pct":"4.98","activity":"Buy","shares":"61900000","value":"14900000000","current_price":"","w52_high":"","w52_low":"","cusip":"46625H100"},{"rank":"9","ticker":"KO","company":"Coca-Cola Co","pct":"3.74","activity":"Unchanged","sh rowser = p.chromium.launch(args=[\"--no-sandbox\"])\n        page = browser.new_page()\n        page.goto(TARGET_LOCAL, wait_until=\"networkidle\")\n        page.wait_for_selector(\"body[data-hydrated='true']\", timeout=10000)\n\n        rows = page.eval_on_selector_all(\n            \"#holdings tbody tr\",\n            \"\"\"els => els.map(tr => {\n                const td = [...tr.children].map(c => c.textContent.trim());\n                return {rank:td[0], ticker:td[1], company:td[2], pct:td[3],\n                        activity:td[4], shares:td[5], value:td[6],\n                        current_price:td[7], w52_high:td[8], w52_low:td[9],\n                        cusip: tr.getAttribute('data-cusip') || ''};\n            })\"\"\"\n        )\n        rendered = page.content()          # 渲染后的 DOM，不是原始 HTML\n        page.screenshot(path=os.path.join(HERE, \"output_screenshot.png\"),\n                        full_page=True)\n        browser.close()\n\n    save(HERE, rows, raw=rendered, raw_ext=\"html\", elapsed=time.time() - t0,\n         extra={\"engine\": \"Chromium (headless)\",\n                \"screenshot\": \"output_screenshot.png\"},\n         notes=\"★ 拿到了 JS 注入的三列；raw.html 是渲染后 DOM，对比 01 的 raw.html 可见差异\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"332.27","w52_high":"344.57","w52_low":"235.03","cusip":"037833100"},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"412.80","w52_high":"431.20","w52_low":"352.10","cusip":"084670702"},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"228.40","w52_high":"241.90","w52_low":"154.30","cusip":"02079K305"},{"rank":"4","ticker":"MSFT","c kdown — an order of magnitude fewer tokens."},"when":{"zh":"做 RAG、抓非结构化正文","en":"RAG pipelines, unstructured body text"},"ran":true,"status":"RUN","rows_n":10,"js":"✓","elapsed":2.054,"why_not":{"zh":"","en":""},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 08 — Crawl4AI（面向 LLM 的抓取）\n\n算法：\n  1. 底层仍是 Playwright 起一个真实浏览器（所以能执行 JS）\n  2. 渲染完成后，把 DOM 清洗成干净的 Markdown —— 去掉导航、脚本、样式、广告\n  3. 可选：挂 CSS/XPath 抽取策略做结构化输出，或挂 LLM 策略让模型抽\n\n它解决的问题不是「能不能抓到」，而是「抓到的东西能不能直接喂给大模型」。\n原始 HTML 一页可能几万 token，清洗成 Markdown 后往往只剩几百。\n做 RAG、做文档问答时这个差距直接等于成本差距。\n\n但注意：如果你的目标是**结构化数据**（像 13F 持仓表），\n那么 CSS 选择器一步到位，转 Markdown 反而是绕远路 —— 还要再解析一次。\nCrawl4AI 的主场是「非结构化正文」，不是「规整表格」。\n\"\"\"\nimport sys, os, time, asyncio, re\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\n\nfrom common import TARGET_LOCAL, save\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\",\n        \"current_price\", \"w52_high\", \"w52_low\"]\n\n\nasync def run():\n    from crawl4ai import AsyncWebCrawler\n    from crawl4ai.extraction_strategy import JsonCssExtractionStrategy\n    import json as _json\n\n    # 结构化抽取 schema —— Crawl4AI 不只会出 Markdown\n    schema = {\n        \"name\": \"holdings\",\n        \"baseSelector\": \"#holdings tbody tr\",\n        \"fields\": [\n            {\"name\": \"rank\", \"selector\": \"td:nth-child(1)\", \"type\": \"text\"},\n            {\"name\": \"ticker\", \"selector\": \"td:nth-child(2)\", \"type\": \"text\"},\n            {\"name\": \"company\", \"selector\": \"td:nth-child(3)\", \"type\": \"text\"},\n            {\"name\": \"pct\", \"selector\": \"td:nth-child(4)\", \"type\": \"text\"},\n            {\"name\": \"activity\", \"selector\": \"td:nth-child(5)\", \"type\": \"text\"},\n            {\"name\": \"shares\", \"selector\": \"td:nth-child(6)\", \"type\": \"text\"},\n            {\"name\": \"value\", \"selector\": \"td:nth-child(7)\", \"type\": \"text\"},\n            {\"name\": \"current_price\", \"selector\": \"td:nth-child(8)\", \"type\": \"text\"},\n            {\"name\": \"w52_high\", \"selector\": \"td:nth-child(9)\", \"type\": \"text\"},\n            {\"name\": \"w52_low\", \"selector\": \"td:nth-child(10)\", \"type\": \"text\"},\n        ],\n    }\n\n    # Crawl4AI 0.9 起，运行参数集中到 CrawlerRunConfig（0.4 之前是直接传给 arun）\n    from crawl4ai import CrawlerRunConfig, CacheMode\n    cfg = CrawlerRunConfig(\n        extraction_strategy=JsonCssExtractionStrategy(schema),\n        wait_for=\"css:body[data-hydrated='true']\",\n        cache_mode=CacheMode.BYPASS,\n    )\n    async with AsyncWebCrawler(verbose=False) as crawler:\n        res = await crawler.arun(url=TARGET_LOCAL, config=cfg)\n\n    md = \"\"\n    try:\n        md = res.markdown.raw_markdown if hasattr(res.markdown, \"raw_markdown\") \\\n             else str(res.markdown)\n    except Exception:\n        md = \"\"\n\n    rows = []\n    if getattr(res, \"extracted_content\", None):\n        try:\n            rows = _json.loads(res.extracted_content)\n        except Exception:\n            rows = []\n    return rows, md\n\n\ndef main():\n    t0 = time.time()\n    try:\n        rows, md = asyncio.run(run())\n    except Exception as e:\n        save(HERE, [], elapsed=time.time() - t0,\n             notes=f\"运行失败：{type(e).__name__}: {str(e)[:150]}\")\n        return\n\n    out = os.path.join(HERE, \"output\")\n    os.makedirs(out, exist_ok=True)\n    with open(os.path.join(out, \"page.md\"), \"w\", encoding=\"utf-8\") as f:\n        f.write(md)\n\n    save(HERE, rows, elapsed=time.time() - t0,\n         extra={\"markdown_chars\": len(md), \"also_wrote\": \"output/page.md\"},\n         notes=\"JsonCssExtractionStrategy 做结构化抽取 + 同时产出干净 Markdown；底层是 Playwright 所以能看到 JS 列\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"332.27","w52_high":"344.57","w52_low":"235.03"},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"412.80","w52_high":"431.20","w52_low":"352.10"},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"228.40","w52_high":"241.90","w52_low":"154.30"},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000","current_price":"498.10","w52_high":"512.40","w52_low":"385.60"},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000","current_price":"231.70","w52_high":"248.30","w52_low":"166.40"},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000","current_price":"171.20","w52_high":"195.80","w52_low":"98.10"},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Corp","pct":"5.62","activity":"Unchanged","shares":"142000000","value":"16820000000","current_price":"121.40","w52_high":"129.70","w52_low":"103.20"},{"rank":"8","ticker":"JPM","company":"JPMorgan Chase & Co","pct":"4.98","activity":"Buy","shares":"61900000","value":"14900000000","current_price":"262.90","w52_high":"278.50","w52_low":"201.80"},{"rank":"9","ticker":"KO","company":"Coca-Cola Co","pct":"3.74","activity":"Unchanged","shares":"400000000","value":"11190000000","current_price":"71.30","w52_high":"76.40","w52_low":"60.90"},{"rank":"10","ticker":"PFE","company":"Pfizer Inc","pct":"2.31","activity":"Sold Out","shares":"0","value":"0","current_price":"26.80","w52_high":"31.20","w52_low":"24.10"}],"summary":{"method":"08_crawl4ai","rows":10,"rows_expected":10,"static_cols_ok":true,"first_row_correct":true,"js_cols_captured":true,"elapsed_s":2.054,"notes":"JsonCssExtractionStrategy 做结构化抽取 + 同时产出干净 Markdown；底层是 Playwright 所以能看到 JS 列","ran_at":"2026-10-08 22:41:04","markdown_chars":1862,"also_wrote":"output/page.md"}},{"key":"09_scrapling","name":"Scrapling","layer":{"zh":"第2层 · 自适应","en":"L2 · adaptive"},"desc":{"zh":"记录元素指纹，页面改版后自动找回；但会静默错配，必须配断言。","en":"Fingerprints elements so it can find them again after a redesign; mismatches silently, so assertions are mandatory."},"when":{"zh":"长期运行、目标站常改版","en":"Long-running jobs against sites that keep changing"},"ran":true,"status":"RUN","rows_n":10,"js":"✗","elapsed":0.329,"why_not":{"zh":"","en":""},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 09 — Scrapling（自适应 selector）\n\n算法：\n  1. 第一次抓取时，除了按 selector 定位元素，还把该元素的**特征指纹**\n     （标签名、属性集合、文本模式、在 DOM 中的相对位置、兄弟节点结构）存进本地库\n  2. 下次页面改版、原 selector 失效时，用这份指纹在新 DOM 里做相似度匹配，\n     自动找回「同一个」元素\n  3. 需要 auto_save=True / auto_match=True 才启用这套机制\n\n它解决的是爬虫工程里最烦的那件事：**目标站改版，selector 全挂，要重写。**\n对长期运行的采集任务（比如你那个季度刷新的 13F 站），这个能力有实际价值。\n\n代价：指纹匹配不是百分百可靠，改版幅度大时仍会错配，而且是**静默错配**——\n拿到的是结构相似但语义不同的元素。所以必须配断言：\n行数对不对、首行值对不对、字段格式对不对，不对就告警而不是继续跑。\n\"\"\"\nimport sys, os, time\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\n\nfrom common import TARGET_LOCAL, save\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\",\n        \"current_price\", \"w52_high\", \"w52_low\"]\n\n\ndef main():\n    t0 = time.time()\n    rows, engine = [], \"\"\n    try:\n        try:                              # 0.3+ 的接口\n            from scrapling.fetchers import Fetcher\n        except ImportError:               # 旧版回退\n            from scrapling import Fetcher\n\n        page = Fetcher.get(TARGET_LOCAL, stealthy_headers=True)\n        engine = \"scrapling.Fetcher (静态，不执行 JS)\"\n\n        for tr in page.css(\"#holdings tbody tr\"):\n            tds = [td.text.strip() for td in tr.css(\"td\")]\n            tds += [\"\"] * (len(COLS) - len(tds))\n            row = dict(zip(COLS, tds))\n            row[\"cusip\"] = tr.attrib.get(\"data-cusip\", \"\")\n            rows.append(row)\n\n    except Exception as e:\n        save(HERE, [], elapsed=time.time() - t0,\n             notes=f\"运行失败：{type(e).__name__}: {str(e)[:150]}\")\n        return\n\n    save(HERE, rows, elapsed=time.time() - t0,\n         extra={\"engine\": engine,\n                \"adaptive_note\": \"auto_save/auto_match 需多次运行跨版本才看得出效果，单次 demo 体现不了\"},\n         notes=\"静态 Fetcher 模式，结果同 01/02；自适应能力要在页面改版后才显现\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"","w52_high":"","w52_low":"","cusip":"037833100"},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"","w52_high":"","w52_low":"","cusip":"084670702"},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"","w52_high":"","w52_low":"","cusip":"02079K305"},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000","current_price":"","w52_high":"","w52_low":"","cusip":"594918104"},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000","current_price":"","w52_high":"","w52_low":"","cusip":"023135106"},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000","current_price":"","w52_high":"","w52_low":"","cusip":"67066G104"},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Corp","pct":"5.62","activity":"Unchanged","shares":"142000000","value":"16820000000","current_price":"","w52_high":"","w52_low":"","cusip":"30231G102"},{"rank":"8","ticker":"JPM",

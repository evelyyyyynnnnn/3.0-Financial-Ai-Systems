get\", \"fixture_13f.html\")\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\",\n        \"current_price\", \"w52_high\", \"w52_low\"]\n\n\ndef main():\n    t0 = time.time()\n    md_engine = MarkItDown()\n    res = md_engine.convert(os.path.abspath(FIXTURE))\n    md = res.text_content\n\n    # 从 Markdown 表格里把行解析回结构化数据\n    rows = []\n    for line in md.splitlines():\n        line = line.strip()\n        if not line.startswith(\"|\"):\n            continue\n        cells = [c.strip() for c in line.strip(\"|\").split(\"|\")]\n        if len(cells) < 7:\n            continue\n        if not re.fullmatch(r\"\\d+\", cells[0]):      # 跳过表头和分隔行\n            continue\n        cells += [\"\"] * (len(COLS) - len(cells))\n        rows.append(dict(zip(COLS, cells)))\n\n    out = os.path.join(HERE, \"output\")\n    os.makedirs(out, exist_ok=True)\n    with open(os.path.join(out, \"page.md\"), \"w\", encoding=\"utf-8\") as f:\n        f.write(md)\n\n    save(HERE, rows, elapsed=time.time() - t0,\n         extra={\"markdown_chars\": len(md), \"also_wrote\": \"output/page.md\"},\n         notes=\"读本地文件而非发请求 —— 它是格式转换器不是爬虫；表格被转成 Markdown 表格后需再解析一次\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000","current_price":"","w52_high":"","w52_low":""},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000","current_price":"","w52_high":"","w52_low":""},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000","current_price":"","w52_high":"","w52_low":""},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000","current_price":"","w52_high":"","w52_low":""},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000","current_price":"","w52_high":"","w52_low":""},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000","current_price":"","w52_high":"","w52_low":""},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Corp","pct":"5.62","activity":"Unchanged","shares":"142000000","value":"16820000000","current_price":"","w52_high":"","w52_low":""},{"rank":"8","ticker":"JPM","company":"JPMorgan Chase & Co","pct":"4.98","activity":"Buy","shares":"61900000","value":"14900000000","current_price":"","w52_high":"","w52_low":""},{"rank":"9","ticker":"KO","company":"Coca-Cola Co","pct":"3.74","activity":"Unchanged","shares":"400000000","value":"11190000000","current_price":"","w52_high":"","w52_low":""},{"rank":"10","ticker":"PFE","company":"Pfizer Inc","pct":"2.31","activity":"Sold Out","shares":"0","value":"0","current_price":"","w52_high":"","w52_low":""}],"summary":{"method":"10_markitdown","rows":10,"rows_expected":10,"static_cols_ok":true,"first_row_correct":true,"js_cols_captured":false,"elapsed_s":0.097,"notes":"读本地文件而非发请求 —— 它是格式转换器不是爬虫；表格被转成 Markdown 表格后需再解析一次","ran_at":"2026-10-08 22:40:23","markdown_chars":1554,"also_wrote":"output/page.md"}},{"key":"11_pymupdf","name":"PyMuPDF","layer":{"zh":"工具层 · PDF解析","en":"Utility · PDF parsing"},"desc":{"zh":"按坐标和线条推测表格结构。极快极轻；无线条/跨页表格易错。","en":"Infers table structure from coordinates and rules. Very fast, very light; struggles with borderless or cross-page tables."},"when":{"zh":"PDF 量大、表格规整","en":"High PDF volume, regular tables"},"ran":true,"status":"RUN","rows_n":10,"js":"✗","elapsed":0.164,"why_not":{"zh":"","en":""},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 11 — PyMuPDF（PDF 解析，顺带演示表格抽取）\n\n算法：\n  1. 先用 PyMuPDF 生成一份「13F 季报 PDF」当素材（真实场景里这一步是下载来的）\n  2. 打开 PDF，逐页调用 page.find_tables() 做表格检测\n  3. 命中的表格用 table.extract() 取成二维数组\n  4. 退路：page.get_text() 拿纯文本再自己切\n\n定位：PDF 是**没有结构的结构化数据**——看起来是表格，底层只是\n一堆带坐标的文字块。所有 PDF 解析库做的事，本质都是\n「根据坐标和线条推测哪些文字属于同一行同一列」。\n\nPyMuPDF 的特点是**快**（C 底层）且**轻**（无额外依赖）。\nDocling 表格识别更准但依赖 torch，装起来好几个 G。\n选哪个取决于：你的 PDF 表格规不规整、量大不大、能不能接受重依赖。\n\"\"\"\nimport sys, os, time\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\n\nimport pymupdf\nfrom common import save\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nOUT = os.path.join(HERE, \"output\")\nCOLS = [\"rank\", \"ticker\", \"company\", \"pct\", \"activity\", \"shares\", \"value\"]\n\nDATA = [\n    (\"1\", \"AAPL\", \"Apple Inc\", \"22.04\", \"Unchanged\", \"227917808\", \"65950296000\"),\n    (\"2\", \"BRK.B\", \"Berkshire Hathaway Inc\", \"13.11\", \"Add\", \"98400000\", \"39240000000\"),\n    (\"3\", \"GOOGL\", \"Alphabet Inc Class A\", \"10.52\", \"Buy\", \"142300000\", \"31480000000\"),\n    (\"4\", \"MSFT\", \"Microsoft Corp\", \"9.87\", \"Unchanged\", \"61200000\", \"29540000000\"),\n    (\"5\", \"AMZN\", \"Amazon.com Inc\", \"8.43\", \"Reduce\", \"111500000\", \"25230000000\"),\n    (\"6\", \"NVDA\", \"NVIDIA Corp\", \"7.15\", \"Add\", \"134800000\", \"21400000000\"),\n    (\"7\", \"XOM\", \"Exxon Mobil Corp\", \"5.62\", \"Unchanged\", \"142000000\", \"16820000000\"),\n    (\"8\", \"JPM\", \"JPMorgan Chase & Co\", \"4.98\", \"Buy\", \"61900000\", \"14900000000\"),\n    (\"9\", \"KO\", \"Coca-Cola Co\", \"3.74\", \"Unchanged\", \"400000000\", \"11190000000\"),\n    (\"10\", \"PFE\", \"Pfizer Inc\", \"2.31\", \"Sold Out\", \"0\", \"0\"),\n]\nWIDTHS = [36, 58, 190, 62, 76, 92, 104]\n\n\ndef make_pdf(path):\n    \"\"\"造一份带真实表格线的 PDF —— find_tables 依赖线条来切分单元格。\"\"\"\n    doc = pymupdf.open()\n    page = doc.new_page(width=720, height=540)\n    page.insert_text((40, 46), \"Demo Fund Management LP - Form 13F Holdings\",\n                     fontsize=14, fontname=\"hebo\")\n    page.insert_text((40, 64), \"Period: Q2 2026 | Filed: 2026-08-14 | CIK 0001999999\",\n                     fontsize=8.5)\n\n    x0, y0, rh = 40, 86, 26\n    header = [\"Rank\", \"Ticker\", \"Company\", \"% Port\", \"Activity\", \"Shares\", \"Value ($)\"]\n    nrows = len(DATA) + 1\n    total_w = sum(WIDTHS)\n\n    for i, cells in enumerate([header] + [list(d) for d in DATA]):\n        y = y0 + i * rh\n        x = x0\n        for w, txt in zip(WIDTHS, cells):\n            page.draw_rect(pymupdf.Rect(x, y, x + w, y + rh),\n                           color=(0.75, 0.75, 0.78), width=0.6)\n            page.insert_text((x + 4, y + 17), str(txt), fontsize=8.5,\n                             fontname=\"hebo\" if i == 0 else \"helv\")\n            x += w\n    page.draw_rect(pymupdf.Rect(x0, y0, x0 + total_w, y0 + nrows * rh),\n                   color=(0.3, 0.3, 0.35), width=1.1)\n\n    doc.save(path)\n    doc.close()\n\n\ndef main():\n    t0 = time.time()\n    os.makedirs(OUT, exist_ok=True)\n    pdf_path = os.path.join(OUT, \"demo_13f_report.pdf\")\n    make_pdf(pdf_path)\n\n    doc = pymupdf.open(pdf_path)\n    rows, n_tables = [], 0\n    for page in doc:\n        tabs = page.find_tables()\n        n_tables += len(tabs.tables)\n        for tab in tabs.tables:\n            for rec in tab.extract():\n                cells = [(c or \"\").strip() for c in rec]\n                if not cells or not cells[0].isdigit():\n                    continue\n                cells += [\"\"] * (len(COLS) - len(cells))\n                rows.append(dict(zip(COLS, cells[:len(COLS)])))\n    text = \"\\n\".join(p.get_text() for p in doc)\n    doc.close()\n\n    with open(os.path.join(OUT, \"extracted_text.txt\"), \"w\", encoding=\"utf-8\") as f:\n        f.write(text)\n\n    save(HERE, rows, elapsed=time.time() - t0,\n         extra={\"tables_detected\": n_tables,\n                \"pdf\": \"output/demo_13f_report.pdf\",\n                \"also_wrote\": \"output/extracted_text.txt\"},\n         notes=\"先造 PDF 再解析，演示完整往返；PDF 没有 JS 概念，故无 JS 列\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[{"rank":"1","ticker":"AAPL","company":"Apple Inc","pct":"22.04","activity":"Unchanged","shares":"227917808","value":"65950296000"},{"rank":"2","ticker":"BRK.B","company":"Berkshire Hathaway Inc","pct":"13.11","activity":"Add","shares":"98400000","value":"39240000000"},{"rank":"3","ticker":"GOOGL","company":"Alphabet Inc Class A","pct":"10.52","activity":"Buy","shares":"142300000","value":"31480000000"},{"rank":"4","ticker":"MSFT","company":"Microsoft Corp","pct":"9.87","activity":"Unchanged","shares":"61200000","value":"29540000000"},{"rank":"5","ticker":"AMZN","company":"Amazon.com Inc","pct":"8.43","activity":"Reduce","shares":"111500000","value":"25230000000"},{"rank":"6","ticker":"NVDA","company":"NVIDIA Corp","pct":"7.15","activity":"Add","shares":"134800000","value":"21400000000"},{"rank":"7","ticker":"XOM","company":"Exxon Mobil Corp","pct":"5.62","activity":"Unchanged","shares":"142000000","value":"16820000000"},{"rank":"8","ticker":"JPM","company":"JPMorgan Chase & Co","pct":"4.98","activity":"Buy","shares":"61900000","value":"14900000000"},{"rank":"9","ticker":"KO","company":"Coca-Cola Co","pct":"3.74","activity":"Unchanged","shares":"400000000","value":"11190000000"},{"rank":"10","ticker":"PFE","company":"Pfizer Inc","pct":"2.31","activity":"Sold Out","shares":"0","value":"0"}],"summary":{"method":"11_pymupdf","rows":10,"rows_expected":10,"static_cols_ok":true,"first_row_correct":true,"js_cols_captured":false,"elapsed_s":0.164,"notes":"先造 PDF 再解析，演示完整往返；PDF 没有 JS 概念，故无 JS 列","ran_at":"2026-10-08 22:40:23","tables_detected":1,"pdf":"output/demo_13f_report.pdf","also_wrote":"output/extracted_text.txt"}},{"key":"12_cli_downloaders","name":"curl / wget / aria2","layer":{"zh":"第1层 · 纯下载","en":"L1 · download only"},"desc":{"zh":"无解析，纯搬字节。目标已经是文件时，这就是全部答案。","en":"No parsing, just moving bytes. When the target is already a file, this is the whole answer."},"when":{"zh":"目标是 ZIP/CSV/PDF 文件","en":"The target is a ZIP / CSV / PDF"},"ran":true,"status":"RUN","rows_n":"—","js":"✗","elapsed":"—","why_not":{"zh":"","en":""},"code":"#!/usr/bin/env bash\n# 方法 12 — curl / wget / aria2（命令行下载器）\n#\n# 算法：无解析，纯粹把字节搬下来。\n#   curl   —— 单请求之王，几乎每台机器都有，适合写进脚本和 CI\n#   wget   —— 带 --mirror 可以整站递归下载，断点续传好用\n#   aria2c —— 多连接并行，单个大文件能切成 N 段同时下，批量下载最快\n#\n# 定位：当目标**已经是文件**（ZIP / CSV / PDF / XML）时，这一类就是全部答案。\n# SEC 的 13F 季度数据集正是这种情况 —— 一个静态 ZIP 链接，\n# 写个 curl + cron 就完事，上任何框架都是多余的。\n#\n# 关键区别：前面 01–09 解决的是「从 HTML 里抠数据」；\n# 这一类解决的是「把文件搬下来」。搞清楚目标是哪一种，能省掉 90% 的工作。\n\nset -u\nHERE=\"$(cd \"$(dirname \"$0\")\" && pwd)\"\nOUT=\"$HERE/output\"\nmkdir -p \"$OUT\"\nexport NO_PROXY='*' no_proxy='*'\n\nTARGET=\"${LAB_TARGET:-http://127.0.0.1:8899/fixture_13f.html}\"\nREMOTE=\"https://raw.githubusercontent.com/python/cpython/main/README.rst\"\n\necho \"{\"                                        >  \"$OUT/summary.json\"\necho \"  \\\"method\\\": \\\"12_cli_downloaders\\\",\"    >> \"$OUT/summary.json\"\n\n# ---------- curl ----------\nif command -v curl >/dev/null; then\n  t=$(curl -sS -o \"$OUT/via_curl.html\" -w \"%{time_total}\" \"$TARGET\")\n  sz=$(wc -c < \"$OUT/via_curl.html\" 2>/dev/null || echo 0)\n  echo \"  \\\"curl\\\": {\\\"ok\\\": true, \\\"bytes\\\": $sz, \\\"seconds\\\": \\\"$t\\\"},\" >> \"$OUT/summary.json\"\n  echo \"curl   OK  ${sz}B\"\nelse\n  echo \"  \\\"curl\\\": {\\\"ok\\\": false},\" >> \"$OUT/summary.json\"; echo \"curl   missing\"\nfi\n\n# ---------- wget ----------\nif command -v wget >/dev/null; then\n  wget -q -O \"$OUT/via_wget.html\" \"$TARGET\" && ok=true || ok=false\n  sz=$(wc -c < \"$OUT/via_wget.html\" 2>/dev/null || echo 0)\n  echo \"  \\\"wget\\\": {\\\"ok\\\": $ok, \\\"bytes\\\": $sz},\" >> \"$OUT/summary.json\"\n  echo \"wget   OK  ${sz}B\"\nelse\n  echo \"  \\\"wget\\\": {\\\"ok\\\": false},\" >> \"$OUT/summary.json\"; echo \"wget   missing\"\nfi\n\n# ---------- aria2 ----------\nif command -v aria2c >/dev/null; then\n  aria2c -q -d \"$OUT\" -o via_aria2.html --allow-overwrite=true \"$TARGET\" && ok=true || ok=false\n  sz=$(wc -c < \"$OUT/via_aria2.html\" 2>/dev/null || echo 0)\n  echo \"  \\\"aria2\\\": {\\\"ok\\\": $ok, \\\"bytes\\\": $sz},\" >> \"$OUT/summary.json\"\n  echo \"aria2  OK  ${sz}B\"\nelse\n  echo \"  \\\"aria2\\\": {\\\"ok\\\": false, \\\"reason\\\": \\\"未安装（apt 不可达）\\\"},\" >> \"$OUT/summary.json\"\n  echo \"aria2  未安装\"\nfi\n\n# ---------- 真实远程（证明不只是本地） ----------\ncode=$(curl -sS -o \"$OUT/remote_real.txt\" -w \"%{http_code}\" --max-time 25 \"$REMOTE\")\nsz=$(wc -c < \"$OUT/remote_real.txt\" 2>/dev/null || echo 0)\necho \"  \\\"remote_real_fetch\\\": {\\\"url\\\": \\\"$REMOTE\\\", \\\"http\\\": $code, \\\"bytes\\\": $sz}\" >> \"$OUT/summary.json\"\necho \"远程真实抓取 raw.githubusercontent -> HTTP $code, ${sz}B\"\n\necho \"}\" >> \"$OUT/summary.json\"\necho \"写出: $OUT/summary.json\"\n","code_name":"run.sh","rows":[],"summary":{"method":"12_cli_downloaders","curl":{"ok":true,"bytes":5604,"seconds":"0.000967"},"wget":{"ok":true,"bytes":5604},"aria2":{"ok":false,"reason":"未安装（apt 不可达）"},"remote_real_fetch":{"url":"https://raw.githubusercontent.com/python/cpython/main/README.rst","http":200,"bytes":8912}}},{"key":"13_firecrawl","name":"Firecrawl","layer":{"zh":"托管服务","en":"Managed service"},"desc":{"zh":"代理池/验证码/浏览器集群都替你管，卖的是省心；按量付费。","en":"Proxy pools, captchas and browser fleets are someone else's problem; you pay per use."},"when":{"zh":"抓几千个有反爬的异构站","en":"Thousands of heterogeneous, defended sites"},"ran":false,"status":"NOT_RUN","rows_n":"—","js":"—","elapsed":"—","why_not":{"zh":"需 FIRECRAWL_API_KEY，云端按量计费","en":"Needs FIRECRAWL_API_KEY; the cloud tier bills per use"},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 13 — Firecrawl（托管抓取 API）   ⚠ 本实验环境未执行\n\n未执行原因：需要 FIRECRAWL_API_KEY，且云端按量计费。本实验不消耗你的额度。\n            （Firecrawl 有自托管开源版，但要起 Docker + Redis + Playwright 集群，\n             在这个容器里装不动。）\n\n算法：\n  1. 你把 URL POST 给 Firecrawl 的服务端\n  2. 它在自己的基础设施上起浏览器、处理反爬、重试、代理轮换\n  3. 返回清洗好的 Markdown / HTML / 结构化 JSON\n  4. /crawl 可以递归整站，/map 只返回站点所有 URL\n\n它卖的不是技术，是**省心**：代理池、验证码、浏览器集群、重试逻辑\n全都不用你管。规模化抓取时这些运维成本往往比写 parser 高得多。\n\n对 13F 场景的判断：**不值得。** SEC 是静态文件、无反爬，\n用托管服务等于为你完全用不上的能力付费。\nFirecrawl 的主场是「要抓几千个结构各异、有反爬的站点」。\n\n怎么跑：\n    pip install firecrawl-py\n    export FIRECRAWL_API_KEY=fc-xxxx\n    python3 run.py\n\"\"\"\nimport os, sys, json, time\n\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\"))\nHERE = os.path.dirname(os.path.abspath(__file__))\n\nTARGET = os.environ.get(\"LAB_TARGET\", \"https://example.com\")\n\n\ndef main():\n    key = os.environ.get(\"FIRECRAWL_API_KEY\")\n    if not key:\n        print(\"未设置 FIRECRAWL_API_KEY —— 跳过。这正是本方法在实验里标记为「未执行」的原因。\")\n        return\n\n    from firecrawl import FirecrawlApp\n    app = FirecrawlApp(api_key=key)\n\n    t0 = time.time()\n    # ① 单页抓取：返回清洗后的 markdown + html\n    res = app.scrape_url(TARGET, params={\"formats\": [\"markdown\", \"html\"]})\n\n    # ② 结构化抽取：给个 JSON schema，让它直接返回结构化数据\n    schema = {\n        \"type\": \"object\",\n        \"properties\": {\n            \"holdings\": {\n                \"type\": \"array\",\n                \"items\": {\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"ticker\": {\"type\": \"string\"},\n                        \"company\": {\"type\": \"string\"},\n                        \"pct\": {\"type\": \"number\"},\n                        \"shares\": {\"type\": \"number\"},\n                    },\n                },\n            }\n        },\n    }\n    structured = app.scrape_url(\n        TARGET,\n        params={\"formats\": [\"extract\"], \"extract\": {\"schema\": schema}},\n    )\n\n    out = os.path.join(HERE, \"output\")\n    os.makedirs(out, exist_ok=True)\n    with open(os.path.join(out, \"result.json\"), \"w\", encoding=\"utf-8\") as f:\n        json.dump({\"scrape\": res, \"structured\": structured,\n                   \"elapsed_s\": round(time.time() - t0, 2)},\n                  f, ensure_ascii=False, indent=2, default=str)\n    print(\"已写出 output/result.json\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[],"summary":{}},{"key":"14_browser_use","name":"Browser Use","layer":{"zh":"第4层 · Agent","en":"L4 · agent"},"desc":{"zh":"DOM 抽成编号清单 → LLM 每步决定点哪里。慢几百倍贵几千倍，结果不确定。","en":"DOM becomes a numbered list, then the LLM decides each click. Hundreds of times slower, thousands of times costlier, non-deterministic."},"when":{"zh":"登录墙后、多步表单","en":"Behind logins, multi-step forms"},"ran":false,"status":"NOT_RUN","rows_n":"—","js":"—","elapsed":"—","why_not":{"zh":"需 LLM API key，按 token 计费","en":"Needs an LLM API key and bills per token"},"code":"#!/usr/bin/env python3\n\"\"\"\n方法 14 — Browser Use（LLM 驱动浏览器）   ⚠ 本实验环境未执行\n\n未执行原因：需要 LLM API key，每一步都产生真实 token 费用。\n            本实验不替你花钱，也不在无人值守下让 agent 自由上网。\n\n算法（和前面所有方法都不是一类东西）：\n  1. 起一个真实浏览器，打开页面\n  2. 把 DOM 里的**可交互元素**抽出来，编号成文本清单\n     （[1] 搜索框 [2] 登录按钮 [3] 下一页链接 …）\n  3. 把「清单 + 你的任务描述 + 历史动作」丢给大模型\n  4. 模型回一个动作（点第 3 个、在第 1 个里输入 xxx、往下滚）\n  5. 执行，重新抽 DOM，回到第 3 步，循环直到模型判断任务完成\n\n它和 Playwright 的根本区别：\n  Playwright —— **你**写死每一步该点哪里\n  Browser Use —— **模型**每一步临场决定点哪里\n\n所以它的适用场景是：**流程不固定、页面每次都不一样、不值得为它写 parser**。\n比如「去这十个供应商后台各自导出上月账单」——每个后台长得都不一样。\n\n对 13F 场景的判断：**明确不要用。**\n  · SEC 是固定 URL 的静态文件，没有任何需要「临场判断」的地方\n  · 每页过一次大模型 = 慢几百倍、贵几千倍\n  · 结果不确定：同样的输入，模型两次可能走不同路径\n  · 提示词注入风险：页面里可以藏给 agent 看的指令\n\n什么时候真该用它：登录墙后面、多步表单、没有 API 又必须模拟人操作。\n你那个 PERM 采集器就是典型的合适场景。\n\n怎么跑：\n    pip install browser-use\n    playwright install chromium\n    export OPENAI_API_KEY=sk-xxx        # 或 ANTHROPIC_API_KEY\n    python3 run.py\n\"\"\"\nimport os, sys, asyncio, json\n\nHERE = os.path.dirname(os.path.abspath(__file__))\nTASK = (\n    \"打开 http://127.0.0.1:8899/fixture_13f.html，\"\n    \"把持仓表里每一行的 ticker、% Portfolio、Shares、Current Price 读出来，\"\n    \"以 JSON 数组返回，不要编造任何数值。\"\n)\n\n\nasync def run():\n    from browser_use import Agent\n    from langchain_openai import ChatOpenAI       # 也可换成 ChatAnthropic\n\n    agent = Agent(\n        task=TASK,\n        llm=ChatOpenAI(model=\"gpt-4o-mini\"),\n        max_failures=2,\n    )\n    history = await agent.run(max_steps=12)\n    return history.final_result()\n\n\ndef main():\n    if not (os.environ.get(\"OPENAI_API_KEY\") or os.environ.get(\"ANTHROPIC_API_KEY\")):\n        print(\"未设置 LLM API key —— 跳过。这正是本方法标记为「未执行」的原因。\")\n        print(\"提醒：真要跑，先确认目标站点可信 —— agent 会读取页面内容并据此行动，\"\n              \"恶意页面可以藏提示词注入。\")\n        return\n\n    result = asyncio.run(run())\n    out = os.path.join(HERE, \"output\")\n    os.makedirs(out, exist_ok=True)\n    with open(os.path.join(out, \"result.json\"), \"w\", encoding=\"utf-8\") as f:\n        json.dump({\"task\": TASK, \"result\": result}, f, ensure_ascii=False,\n                  indent=2, default=str)\n    print(\"已写出 output/result.json\")\n\n\nif __name__ == \"__main__\":\n    main()\n","code_name":"run.py","rows":[],"summary":{}},{"key":"15_skyvern","name":"Skyvern","layer":{"zh":"第4层 · Agent","en":"L4 · agent"},"desc":{"zh":"视觉路线：截图丢给多模态模型，模型回「点 (x,y)」。表单填写强。","en":"The visual route: screenshot to a multimodal model, which answers 'click (x, y)'. Strong at filling forms."},"when":{"zh":"重视觉界面、canvas","en":"Visually heavy UIs, canvas"},"ran":false,"status":"NOT_RUN","rows_n":"—","js":"—","elapsed":"—","why_not":{"zh":"需 LLM key + Docker Compose 全栈","en":"Needs an LLM key plus the full Docker Compose stack"},"code":"# 方法 15–18：本实验环境未执行的其余四种\n\n这四个各有各的拦路条件，统一放在这里，代码在同目录的对应文件中。\n\n---\n\n## 15. Skyvern（视觉优先的 Agent 浏览器）\n\n**未执行原因**：需要 LLM API key；官方部署方式是 Docker Compose（Postgres + 后端 + 前端），容器内起不来。\n\n**算法**：和 Browser Use 同赛道，但走**视觉路线**——截图丢给多模态模型，模型回「点屏幕上 (x, y)」或「在这个框里填 xxx」。另有一套工作流引擎管多步任务。\n\n**和 Browser Use 的分工**：\n\n| | 路线 | 强项 | 弱项 |\n|---|---|---|---|\n| Browser Use | DOM→文本 | 快、省 token、点击精确 | canvas / 重视觉界面抓瞎 |\n| Skyvern | 截图→视觉 | 任何界面都能看懂，表单填写强 | 慢、贵、坐标点击易偏 |\n\n**对 13F**：同样不适用，理由同 Browser Use。\n\n**怎么跑**\n```bash\ngit clone https://github.com/Skyvern-AI/skyvern && cd skyvern\ncp .env.example .env     # 填 LLM key\ndocker compose up -d     # http://localhost:8080\n```\n\n---\n\n## 16. Stagehand（可控的 Agent 浏览器，Browserbase 出品）\n\n**未执行原因**：TypeScript/Node 生态 + 需要 LLM key；本实验是 Python 环境。\n\n**算法**：在 Playwright 之上加三个 AI 原语，其余照常写代码——\n- `page.act(\"点登录按钮\")` —— 让模型决定怎么点\n- `page.extract({schema})` —— 让模型按 schema 抽数据\n- `page.observe()` —— 问模型页面上有什么可操作的\n\n**定位**：介于「纯代码」和「纯 agent」之间。确定的步骤你自己写死（快且稳），不确定的那一两步交给模型。这是三个 agent 方案里工程上最务实的一个。\n\n**对 13F**：仍不需要，但如果将来要抓的是**有登录 + 结构多变**的二手站，Stagehand 比全自动 agent 更可控。\n\n**怎么跑**\n```bash\nnpm install @browserbasehq/stagehand playwright\nexport OPENAI_API_KEY=sk-xxx\nnpx tsx run.ts        # 见同目录 stagehand_run.ts\n```\n\n---\n\n## 17. Katana（URL 发现，ProjectDiscovery 出品）\n\n**未执行原因**：Go 二进制，要从 GitHub Releases 下载；本环境的出口策略只放行 `raw.githubusercontent.com`，releases 的 CDN 不可达。\n\n**算法**：给一个起始域名，并发递归爬遍站内链接，输出**全量 URL 清单**。可选 headless 模式解析 JS 里的链接。它只负责「这个站有哪些页面」，不负责「页面里有什么数据」。\n\n**典型用法**：先用 Katana 摸清站点结构 → 再用 Scrapy/httpx 去抓你要的那几类页面。两步分开，比一个爬虫边发现边抓要清晰得多。\n\n**对 13F**：不需要。SEC 的 URL 规则是公开且固定的（`.../YYYYqN_form13f.zip`），直接构造即可，没有任何需要「发现」的东西。\n\n**怎么跑**\n```bash\ngo install github.com/projectdiscovery/katana/cmd/katana@latest\nkatana -u https://example.com -d 2 -jc -o urls.txt\n```\n\n---\n\n## 18. Docling（IBM 开源文档解析）\n\n**未执行原因**：依赖 PyTorch + 多个视觉模型权重，安装体积数 GB，本容器磁盘配额不够。\n\n**算法**：用版面分析模型识别页面区域（标题/正文/表格/图），再用专门的表格结构识别模型（TableFormer）还原单元格的行列关系，最后输出结构化 JSON 或 Markdown。\n\n**和 PyMuPDF（方法 11）的区别**：\n- PyMuPDF —— 按坐标和线条**推测**表格结构。快、轻，但遇到无线条表格、跨页表格、合并单元格就容易错\n- Docling —— 用**模型**理解表格结构。准确率明显更高，尤其是财报这种复杂表格；代价是慢、重\n\n**对 13F**：SEC 数据集是 TSV/XML，用不上。但如果要处理基金寄来的 PDF 季报，Docling 是目前表格识别最好的开源选择。\n\n**怎么跑**\n```bash\npip install docling          # 会拉 torch，几个 G，耐心等\n```\n```python\nfrom docling.document_converter import DocumentConverter\nres = DocumentConverter().convert(\"report.pdf\")\nprint(res.document.export_to_markdown())\nfor t in res.document.tables:\n    print(t.export_to_dataframe())\n```\n","code_name":"README.md","rows":[],"summary":{}},{"key":"16_stagehand","name":"Stagehand","layer":{"zh":"第4层 · Agent","en":"L4 · agent"},"desc":{"zh":"Playwright + 三个 AI 原语。确定步骤写死，不确定的交给模型 —— 三个 agent 里最务实。","en":"Playwright plus three AI primitives. Hard-code the certain steps, hand the model the uncertain ones — the most pragmatic of the three agents."},"when":{"zh":"部分流程不确定时","en":"When only part of the flow is uncertain"},"ran":false,"status":"NOT_RUN","rows_n":"—","js":"—","elapsed":"—","why_not":{"zh":"Node/TypeScript 生态 + 需 LLM key","en":"Node/TypeScript ecosystem, plus an LLM key"},"code":"/**\n * 方法 16 — Stagehand 示例（TypeScript）   ⚠ 本实验环境未执行\n *\n * 要点：确定的步骤用普通 Playwright 写死（快、稳、免费），\n *      只有不确定的那一步才调 AI 原语（慢、贵、但能应付变化）。\n *\n * 运行：\n *   npm install @browserbasehq/stagehand playwright zod\n *   export OPENAI_API_KEY=sk-xxx\n *   npx tsx stagehand_run.ts\n */\nimport { Stagehand } from \"@browserbasehq/stagehand\";\nimport { z } from \"zod\";\n\nconst Holding = z.object({\n  ticker: z.string(),\n  company: z.string(),\n  pct: z.number(),\n  shares: z.number(),\n  currentPrice: z.number().nullable(),\n});\n\nasync function main() {\n  const sh = new Stagehand({\n    env: \"LOCAL\",                 // 换成 \"BROWSERBASE\" 可跑在托管浏览器上\n    modelName: \"gpt-4o-mini\",\n    verbose: 1,\n  });\n  await sh.init();\n  const page = sh.page;\n\n  // —— 确定的部分：普通 Playwright，不花一分钱 ——\n  await page.goto(\"http://127.0.0.1:8899/fixture_13f.html\");\n  await page.waitForSelector(\"body[data-hydrated='true']\");\n\n  // —— 不确定的部分：交给模型按 schema 抽 ——\n  const result = await page.extract({\n    instruction:\n      \"抽取持仓表的每一行。只读页面上实际显示的数值，不要推断或编造。\",\n    schema: z.object({ holdings: z.array(Holding) }),\n  });\n\n  console.log(JSON.stringify(result, null, 2));\n  await sh.close();\n}\n\nmain().catch((e) => {\n  console.error(e);\n  process.exit(1);\n});\n","code_name":"stagehand_run.ts","rows":[],"summary":{}},{"key":"17_katana","name":"Katana","layer":{"zh":"辅助 · URL发现","en":"Support · URL discovery"},"desc":{"zh":"只回答「这个站有哪些页面」，不负责抓数据。Go 写的，极快。","en":"Answers only 'what pages does this site have', never 'what's in them'. Written in Go, extremely fast."},"when":{"zh":"先摸清站点结构","en":"Mapping a site's structure first"},"ran":false,"status":"NOT_RUN","rows_n":"—","js":"—","elapsed":"—","why_not":{"zh":"Go 二进制，需从 GitHub Releases 下载（出口策略不放行）","en":"A Go binary from GitHub Releases, which the egress policy blocks"},"code":"# 方法 15–18：本实验环境未执行的其余四种\n\n这四个各有各的拦路条件，统一放在这里，代码在同目录的对应文件中。\n\n---\n\n## 15. Skyvern（视觉优先的 Agent 浏览器）\n\n**未执行原因**：需要 LLM API key；官方部署方式是 Docker Compose（Postgres + 后端 + 前端），容器内起不来。\n\n**算法**：和 Browser Use 同赛道，但走**视觉路线**——截图丢给多模态模型，模型回「点屏幕上 (x, y)」或「在这个框里填 xxx」。另有一套工作流引擎管多步任务。\n\n**和 Browser Use 的分工**：\n\n| | 路线 | 强项 | 弱项 |\n|---|---|---|---|\n| Browser Use | DOM→文本 | 快、省 token、点击精确 | canvas / 重视觉界面抓瞎 |\n| Skyvern | 截图→视觉 | 任何界面都能看懂，表单填写强 | 慢、贵、坐标点击易偏 |\n\n**对 13F**：同样不适用，理由同 Browser Use。\n\n**怎么跑**\n```bash\ngit clone https://github.com/Skyvern-AI/skyvern && cd skyvern\ncp .env.example .env     # 填 LLM key\ndocker compose up -d     # http://localhost:8080\n```\n\n---\n\n## 16. Stagehand（可控的 Agent 浏览器，Browserbase 出品）\n\n**未执行原因**：TypeScript/Node 生态 + 需要 LLM key；本实验是 Python 环境。\n\n**算法**：在 Playwright 之上加三个 AI 原语，其余照常写代码——\n- `page.act(\"点登录按钮\")` —— 让模型决定怎么点\n- `page.extract({schema})` —— 让模型按 schema 抽数据\n- `page.observe()` —— 问模型页面上有什么可操作的\n\n**定位**：介于「纯代码」和「纯 agent」之间。确定的步骤你自己写死（快且稳），不确定的那一两步交给模型。这是三个 agent 方案里工程上最务实的一个。\n\n**对 13F**：仍不需要，但如果将来要抓的是**有登录 + 结构多变**的二手站，Stagehand 比全自动 agent 更可控。\n\n**怎么跑**\n```bash\nnpm install @browserbasehq/stagehand playwright\nexport OPENAI_API_KEY=sk-xxx\nnpx tsx run.ts        # 见同目录 stagehand_run.ts\n```\n\n---\n\n## 17. Katana（URL 发现，ProjectDiscovery 出品）\n\n**未执行原因**：Go 二进制，要从 GitHub Releases 下载；本环境的出口策略只放行 `raw.githubusercontent.com`，releases 的 CDN 不可达。\n\n**算法**：给一个起始域名，并发递归爬遍站内链接，输出**全量 URL 清单**。可选 headless 模式解析 JS 里的链接。它只负责「这个站有哪些页面」，不负责「页面里有什么数据」。\n\n**典型用法**：先用 Katana 摸清站点结构 → 再用 Scrapy/httpx 去抓你要的那几类页面。两步分开，比一个爬虫边发现边抓要清晰得多。\n\n**对 13F**：不需要。SEC 的 URL 规则是公 IA Corp<\/td><td class=\"num\">7.15<\/td><td>Add<\/td><td class=\"num\">134800000<\/td><td class=\"num\">21400000000<\/td><td class=\"num cp\"><\/td><td class=\"num hi\"><\/td><td class=\"num lo\"><\/td><\/tr>\n    <tr data-cusip=\"30231G102\"><td class=\"num\">7<\/td><td>XOM<\/td><td>Exxon Mobil Corp<\/td><td class=\"num\">5.62<\/td><td>Unchanged<\/td><td class=\"num\">142000000<\/td><td class=\"num\">16820000000<\/td><td class=\"num cp\"><\/td><td class=\"num hi\"><\/td><td class=\"num lo\"><\/td><\/tr>\n    <tr data-cusip=\"46625H100\"><td class=\"num\">8<\/td><td>JPM<\/td><td>JPMorgan Chase &amp; Co<\/td><td class=\"num\">4.98<\/td><td>Buy<\/td><td class=\"num\">61900000<\/td><td class=\"num\">14900000000<\/td><td class=\"num cp\"><\/td><td class=\"num hi\"><\/td><td class=\"num lo\"><\/td><\/tr>\n    <tr data-cusip=\"191216100\"><td class=\"num\">9<\/td><td>KO<\/td><td>Coca-Cola Co<\/td><td class=\"num\">3.74<\/td><td>Unchanged<\/td><td class=\"num\">400000000<\/td><td class=\"num\">11190000000<\/td><td class=\"num cp\"><\/td><td class=\"num hi\"><\/td><td class=\"num lo\"><\/td><\/tr>\n    <tr data-cusip=\"717081103\"><td class=\"num\">10<\/td><td>PFE<\/td><td>Pfizer Inc<\/td><td class=\"num\">2.31<\/td><td>Sold Out<\/td><td class=\"num\">0<\/td><td class=\"num\">0<\/td><td class=\"num cp\"><\/td><td class=\"num hi\"><\/td><td class=\"num lo\"><\/td><\/tr>\n  <\/tbody>\n<\/table>\n\n<div class=\"note\">\n  <strong>Fixture design note.<\/strong> The first seven columns are real HTML in the page source —\n  any HTTP client plus an HTML parser can read them. The last three columns\n  (<span class=\"js-col\">Current Price / 52W High / 52W Low<\/span>) are injected by JavaScript\n  after load, exactly the way Dataroma renders its price columns. A static fetch returns them\n  empty; only a method that executes JavaScript will see values. That one difference is what\n  separates the tool categories in this lab.\n<\/div>\n\n<script>\n// Simulates the client-side price hydration that static scrapers cannot see.\nconst PRICES = {\n  AAPL:[332.27,344.57,235.03], \"BRK.B\":[412.80,431.20,352.10],\n  GOOGL:[228.40,241.90,154.30], MSFT:[498.10,512.40,385.60],\n  AMZN:[231.70,248.30,166.40], NVDA:[171.20,195.80,98.10],\n  XOM:[121.40,129.70,103.20],  JPM:[262.90,278.50,201.80],\n  KO:[71.30,76.40,60.90],      PFE:[26.80,31.20,24.10]\n};\nwindow.addEventListener('DOMContentLoaded', function () {\n  document.querySelectorAll('#holdings tbody tr').forEach(function (tr) {\n    const t = tr.children[1].textContent.trim();\n    const p = PRICES[t];\n    if (!p) return;\n    tr.querySelector('.cp').textContent = p[0].toFixed(2);\n    tr.querySelector('.hi').textContent = p[1].toFixed(2);\n    tr.querySelector('.lo').textContent = p[2].toFixed(2);\n  });\n  document.body.setAttribute('data-hydrated', 'true');\n});\n<\/script>\n<\/body>\n<\/html>\n","doc":"# 爬虫方法实验室 — 技术文档\n\n**一句话结论**：这 18 种工具不是「谁更强」的关系，而是**分属四个不同层次**。\n搞清楚一个任务落在哪一层，90% 的选型问题就自动消失了。\n\n---\n\n## 零、先分层，再选工具\n\n```\n第 4 层  Agent 浏览器     Browser Use · Skyvern · Stagehand\n         「页面每次都不一样，让模型临场决定点哪里」\n                     ↑ 慢几百倍、贵几千倍、结果不确定\n第 3 层  真实浏览器       Playwright · Crawl4AI · Scrapling(动态模式)\n         「数据由 JS 生成，必须执行脚本才能看到」\n                     ↑ 慢一到两个数量级\n第 2 层  HTTP + 解析      requests/httpx + bs4/selectolax/lxml · Scrapy · pandas\n         「数据就在 HTML 源码里，取出来即可」\n                     ↑ 还要解析\n第 1 层  纯下载           curl · wget · aria2\n         「目标本身就是文件：ZIP / CSV / PDF / XML」\n```\n\n**选型只有一个判断流程**：\n\n1. 目标是**文件**吗？→ 第 1 层，结束\n2. 用 `curl` 看一眼，数据在**原始 HTML 源码**里吗？→ 在，第 2 层，结束\n3. 不在（JS 渲染）→ 第 3 层\n4. 流程不固定、要登录、要点一串按钮 → 第 4 层\n\n**绝大多数人的错误是从第 3、4 层往下选**，于是用浏览器去抓一个静态表格，\n或者用大模型去读一个 CSV。本实验的数据直接证明了代价：\n\n| 层次 | 代表方法 | 实测耗时 | 相对倍数 |\n|---|---|---|---|\n| 第 2 层 | curl_cffi | 0.003 s | 1× |\n| 第 2 层 | lxml XPath | 0.005 s | 1.7× |\n| 第 2 层 | requests + bs4 | 0.009 s | 3× |\n| 第 3 层 | Playwright | 1.454 s | **485×** |\n| 第 3 层 | Crawl4AI | 2.054 s | **685×** |\n\n同一个页面、同样 10 行数据。\n\n---\n\n## 一、实验设计\n\n### 为什么用本地靶页而不是随便抓个网站\n\n1. **可比性** —— 12 种方法打同一个靶子，结果差异才归因于方法本身\n2. **合规** —— 不给任何第三方站点添麻烦，不触碰 ToS\n3. **可复现** —— 几个月后再跑，结果一样；抓真实网站过两周就改版了\n4. **能精确暴露能力边界** —— 这是最关键的一条，见下\n\n### 靶页的关键设计\n\n`target/fixture_13f.html` 是一张 13F 持仓表，**故意做成一半静态、一半 JS 渲染**：\n\n| 列 | 来源 | 谁能看到 |\n|---|---|---|\n| Rank / Ticker / Company / % / Activity / Shares / Value | 写死在 HTML 源码里 | 所有方法 |\n| **Current Price / 52W High / 52W Low** | 页面加载后由 JS 注入 | **只有执行 JS 的方法** |\n\n这不是人为刁难——**Dataroma 的价格列就是这么渲染的**，\ngiant-portfolio-tracker 的 `refresh_data.py` 里有一行注释明确写着：\n\n> `NOTE: CurrentPrice/52W columns are JavaScript-rendered — NOT in static HTML.`\n\n所以这个靶页就是你真实问题的最小复现。\n\n### 环境限制（必须说明）\n\n本实验运行在一个出口受限的容器里，只有 PyPI、npm 和 `raw.githubusercontent.com`\n可达，`sec.gov` / `dataroma.com` / `yahoo.com` 全部被策略封锁（HTTP 403）。因此：\n\n- ✅ 12 种方法在本地靶页上**真实执行**，结果为实测\n- ✅ 方法 12 额外做了一次**真实远程抓取**（raw.githubusercontent，HTTP 200，8912 B）证明网络路径通\n- ⚠️ 6 种方法**未执行**，原因见各自目录，代码完整可用\n\n---\n\n## 二、实测结果\n\n| # | 方法 | 状态 | 行数 | 静态列 | **JS 列** | 耗时 |\n|---|---|---|---|---|---|---|\n| 01 | requests + BeautifulSoup | ✅ | 10/10 | ✓ | ✗ | 0.009 s |\n| 02 | httpx + selectolax | ✅ | 10/10 | ✓ | ✗ | 0.128 s |\n| 03 | lxml + XPath | ✅ | 10/10 | ✓ | ✗ | 0.005 s |\n| 04 | pandas.read_html | ✅ | 10/10 | ✓ | ✗ | 0.035 s |\n| 05 | Scrapy | ✅ | 10/10 | ✓ | ✗ | 0.464 s |\n| 06 | curl_cffi | ✅ | 10/10 | ✓ | ✗ | 0.003 s |\n| 07 | **Playwright** | ✅ | 10/10 | ✓ | **✓** | 1.454 s |\n| 08 | **Crawl4AI** | ✅ | 10/10 | ✓ | **✓** | 2.054 s |\n| 09 | Scrapling | ✅ | 10/10 | ✓ | ✗ | 0.329 s |\n| 10 | MarkItDown | ✅ | 10/10 | ✓ | ✗ | 0.097 s |\n| 11 | PyMuPDF | ✅ | 10/10 | ✓ | n/a | 0.164 s |\n| 12 | curl / wget / aria2 | ✅ | 下载器 | — | ✗ | — |\n| 13 | Firecrawl | ⚠️ 未执行 | 需 API key | | | |\n| 14 | Browser Use | ⚠️ 未执行 | 需 LLM key | | | |\n| 15 | Skyvern | ⚠️ 未执行 | 需 LLM key + Docker | | | |\n| 16 | Stagehand | ⚠️ 未执行 | Node + LLM key | | | |\n| 17 | Katana | ⚠️ 未执行 | Go 二进制不可达 | | | |\n| 18 | Docling | ⚠️ 未执行 | torch 数 GB | | | |\n\n**18 种里只有 2 种能拿到 JS 渲染的列。** 这就是全部的关键差异。\n\n---\n\n## 三、逐个方法\n\n### 01 · requests + BeautifulSoup — 行业基线\n\n**算法**：GET 取 HTML → BeautifulSoup 建 DOM 树 → CSS 选择器定位 → 取文本。\n\n| 优势 | 劣势 |\n|---|---|\n| 生态最成熟，报错一搜就有答案 | 解析慢（纯 Python 对象树） |\n| API 直观，新人五分钟上手 | 看不到 JS 渲染内容 |\n| 容错强，烂 HTML 也能解析 | 无并发、无重试，要自己写 |\n\n**什么时候用**：一次性脚本、页面不多、团队里有人要接手维护。**默认从这个开始。**\n\n---\n\n### 02 · httpx + selectolax — 静态页最快组合\n\n**算法**：同 01，但解析器换成 C 实现的 lexbor 引擎。\n\n> ⚠️ selectolax ≥ 1.0 废弃了 modest 后端，必须\n> `from selectolax.lexbor import LexborHTMLParser`，写旧的 `parser` 会直接 ImportError。\n> 这是本实验实际踩到的坑。\n\n| 优势 | 劣势 |\n|---|---|\n| 解析快 5–10 倍 | 选择器支持不如 bs4 全 |\n| httpx 原生 HTTP/2 + async | 生态小，遇坑资料少 |\n\n**什么时候用**：要抓几万页，解析已经成为瓶颈时。十几页别折腾。\n\n---\n\n### 03 · lxml + XPath — 精确定位\n\n**算法**：同 01，但用 XPath 表达式定位。\n\n**XPath 能做而 CSS 做不到的**（本实验实际跑出了结果）：\n\n```python\n# 取 Activity 列等于 \"Buy\" 的那些行的 ticker\ndoc.xpath('//table[@id=\"holdings\"]/tbody/tr[td[5]=\"Buy\"]/td[2]/text()')\n# → ['GOOGL', 'JPM']\n```\n\n还能往上找父节点、按文本内容匹配、写复杂条件。\n\n| 优势 | 劣势 |\n|---|---|\n| 表达力最强，能按内容筛选 | 语法陡峭，可读性差 |\n| 速度快（C 实现） | 对畸形 HTML 比 bs4 挑剔 |\n\n**什么时候用**：页面结构复杂、要按内容而非位置定位。\n\n---\n\n### 04 · pandas.read_html — 表格一行搞定\n\n**算法**：`pd.read_html(html)` 自动找出所有 `<table>`，每个转成 DataFrame。\n\n| 优势 | 劣势 |\n|---|---|\n| 一行代码，自动识别表头 | 只认 `<table>`，div 布局的「表格」抓不到 |\n| 直接出 DataFrame，接分析流程 | 拿不到 `data-cusip` 这类属性 |\n\n**什么时候用**：页面主体就是规整表格。**13F 场景里这是性价比最高的一条。**\n\n---\n\n### 05 · Scrapy — 爬虫框架\n\n**算法**：定义 Spider → 引擎负责调度/并发/去重/重试/限速 → parse() 抽数据 → Pipeline 落盘。\n\n和前面「一次性脚本」的本质区别：Scrapy 管的是**「几万个 URL 怎么排队、失败怎么重试、并发多少不被封」**这一层。\n\n| 优势 | 劣势 |\n|---|---|\n| 调度/去重/重试/限速全内置 | 学习曲线陡，目录结构重 |\n| 中间件生态丰富（代理、UA 轮换） | 单页场景纯属负担 |\n| 天然异步，吞吐量高 | 默认不执行 JS |\n\n**什么时候用**：URL 数量上千、需要长期稳定运行。**13F 只有 20 家，用不上。**\n\n---\n\n### 06 · curl_cffi — TLS 指纹伪装\n\n**算法**：底层用 curl-impersonate 编译的 libcurl，`impersonate=\"chrome\"` 让 **TLS 握手的 JA3 指纹、HTTP/2 帧顺序、header 顺序**全部和真实 Chrome 一致。\n\n**要解决的问题**：Cloudflare / Akamai / PerimeterX **不只看 User-Agent，它们看 TLS 握手指纹**。Python requests 用 OpenSSL 默认配置，指纹和任何浏览器都不一样，一眼识破。\n\n| 优势 | 劣势 |\n|---|---|\n| 能过大部分指纹检测 | 只解决网络层，不执行 JS |\n| API 和 requests 一模一样 | 指纹库要跟着浏览器版本更新 |\n\n**注意**：这是「让请求看起来像浏览器」，**不是「绕过登录或付费墙」**。\n对 SEC 完全没必要；对 Dataroma 这种返 403/429 的站可能是唯一稳定方案——**但先确认 ToS**。\n\n---\n\n### 07 · Playwright — 真实浏览器 ★ 分水岭\n\n**算法**：起真实 Chromium → `goto()` 加载（执行 JS、发 XHR、渲染）→ 等渲染完成 → 从**渲染后的 DOM** 取数据。\n\n**本实验里第一个拿到 JS 列的方法。** 对比 `methods/01/output/raw.html` 和\n`methods/07/output/raw.html` 能直接看到差异：前者那三列是空的 `<td>`，后者有值。\n\n| 优势 | 劣势 |\n|---|---|\n| 所见即所得，JS/SPA 全支持 | 慢 485 倍（实测） |\n| 能截图、录视频、拦截网络 | 吃内存（每实例几百 MB） |\n| 可做登录、点击、滚动 | 部署要带浏览器二进制 |\n\n**判断要不要用**：`curl` 一下看目标数据在不在源码里。在就用 02，不在才上 Playwright。\n\n---\n\n### 08 · Crawl4AI — 面向 LLM 的抓取\n\n**算法**：底层 Playwright（所以能执行 JS）→ 渲染后把 DOM 清洗成干净 Markdown（去导航/脚本/样式/广告）→ 可选挂 CSS 或 LLM 抽取策略。\n\n> ⚠️ 0.9 起运行参数集中到 `CrawlerRunConfig`，旧写法（直接传给 `arun`）会静默\n> 返回空结果。本实验实际踩到：第一次跑 `rows: 0`，改用 config 后才正常。\n\n| 优势 | 劣势 |\n|---|---|\n| 输出直接可喂 LLM，token 省一个数量级 | 结构化数据场景属绕远路 |\n| 自带 CSS / LLM 两种抽取策略 | 依赖重（整个 Playwright） |\n| 完全免费自托管 | API 版本间变动较大 |\n\n**什么时候用**：做 RAG、文档问答，目标是**非结构化正文**。\n抓规整表格的话 CSS 选择器一步到位，转 Markdown 还要再解析一次。\n\n---\n\n### 09 · Scrapling — 自适应 selector\n\n**算法**：首次抓取时记录元素的**特征指纹**（标签、属性集合、文本模式、DOM 相对位置、兄弟结构）；页面改版后用指纹做相似度匹配，自动找回「同一个」元素。\n\n解决的是爬虫工程最烦的事：**目标站改版，selector 全挂，要重写。**\n\n| 优势 | 劣势 |\n|---|---|\n| 页面改版后能自愈 | 匹配不是 100% 可靠 |\n| API 简洁，静态/动态模式都有 | **会静默错配**——拿到结构相似但语义不同的元素 |\n| 自带反检测 header | 项目较新，生态小 |\n\n> ⚠️ 实验中缺 `browserforge` 依赖导致首次运行失败，`pip install browserforge` 后正常。\n\n**必须配套**：行数断言、首行值断言、字段格式校验。不对就告警，**别让它静默跑错**。\n\n---\n\n### 10 · MarkItDown — 任意格式 → Markdown\n\n**算法**：按 MIME 派发到对应转换器（HTML/PDF/DOCX/XLSX/PPTX/图片）→ 统一输出 Markdown。\n\n**它不是爬虫，是格式归一化层。** 典型位置：爬虫把文件弄下来 → MarkItDown 统一成文本 → 喂下游。\n\n| 优势 | 劣势 |\n|---|---|\n| 格式覆盖广，微软维护 | 表格转 Markdown 后还要再解析一次 |\n| 轻量，装起来快 | 复杂版面还原度一般 |\n\n**对 13F**：SEC 给的是 TSV/XML，本来就结构化，走它等于拆了再拼。但处理**基金寄来的 PDF 季报**就很合适。\n\n---\n\n### 11 · PyMuPDF — PDF 解析\n\n**算法**：`page.find_tables()` 做表格检测 → `table.extract()` 取二维数组 → 退路是 `get_text()` 再自己切。\n\n**PDF 是「没有结构的结构化数据」**——看着是表格，底层只是一堆带坐标的文字块。所有 PDF 库做的事本质都是「根据坐标和线条猜哪些文字属于同一行同一列」。\n\n| 优势 | 劣势 |\n|---|---|\n| 极快（C 底层），零额外依赖 | 无线条表格、跨页表格容易错 |\n| 能抽图片、注释、元数据 | 合并单元格处理弱 |\n\n**和 Docling 的取舍**：PyMuPDF 快而轻；Docling 用模型识别表格，准得多但要拉 torch 好几个 G。\n\n---\n\n### 12 · curl / wget / aria2 — 纯下载\n\n**算法**：无解析，纯粹搬字节。\n\n- **curl** — 单请求之王，到处都有，适合写进脚本和 CI\n- **wget** — `--mirror` 整站递归，断点续传\n- **aria2c** — 多连接并行，大文件切段同时下\n\n**当目标已经是文件时，这一类就是全部答案。**\nSEC 的 13F 季度数据集正是如此：一个静态 ZIP 链接，`curl` + `cron` 就完事。\n\n> 本实验中 aria2 未安装（apt 源不可达），curl / wget 均正常，\n> 并成功完成一次真实远程抓取（raw.githubusercontent，HTTP 200，8912 B）。\n\n---\n\n### 13–18 · 未执行的六种\n\n详见 `methods/13_*`、`methods/14_*`、`methods/15_*` 目录，代码完整。要点：\n\n| 方法 | 层次 | 核心定位 | 对 13F |\n|---|---|---|---|\n| **Firecrawl** | 托管抓取 | 代理池/验证码/浏览器集群都替你管，卖的是省心 | 不值得，SEC 无反爬 |\n| **Browser Use** | Agent | DOM→文本编号→LLM 决定点哪里 | 明确不要 |\n| **Skyvern** | Agent | 截图→多模态模型→点坐标，表单填写强 | 明确不要 |\n| **Stagehand** | Agent | Playwright + 三个 AI 原语，确定步骤写死、不确定的交给模型 | 三个 agent 里最务实 |\n| **Katana** | URL 发现 | 只回答「这个站有哪些页面」 | 不需要，SEC URL 规则固定 |\n| **Docling** | 文档解析 | 版面分析 + TableFormer，表格识别最准 | TSV/XML 用不上；PDF 季报很合适 |\n\n---\n\n## 四、给 giant-portfolio-tracker 的结论\n\n现有 `refresh_data.py` 抓 Dataroma / ValueSider / WhaleWisdom / Yahoo。按上面的分层：\n\n| 数据 | 该用哪一层 | 具体方法 |\n|---|---|---|\n| SEC 13F 季度数据集（ZIP） | **第 1 层** | `curl` + `cron`，别上框架 |\n| SEC EDGAR infotable XML | **第 2 层** | `requests` + `pd.read_xml` |\n| Dataroma 静态列 | **第 2 层** | `httpx` + selectolax；被 403 再换 `curl_cffi` |\n| Dataroma 价格列（JS 渲染） | **第 3 层** | Playwright，**但更该直接用 Yahoo API** |\n| 行情 / 52 周高低 | 不是爬虫问题 | 行情 API |\n\n**最该改的一处**：现在为了拿价格列去抓一个 JS 渲染的页面——\n既慢又脆弱还有 ToS 风险。价格直接走行情 API，第 3 层的需求就消失了。\n\n**两条实践建议**：\n\n1. **先 curl 再决定。** 任何新目标，先 `curl` 看数据在不在源码里，省掉大量无谓的浏览器。\n2. **自适应 selector 必须配断言。** 用 Scrapling 这类工具时，行数和首行值的校验不能省——静默错配比直接报错危险得多。\n\n---\n\n## 五、复现\n\n```bash\npip install -r requirements.txt\nplaywright install chromium        # 方法 07 / 08 需要\nbash run_all.sh                    # 起靶站 → 跑全部 → 出对比表\n```\n\n单跑某一个：\n\n```bash\npython3 target/serve.py &          # 先起靶站\npython3 methods/07_playwright/run.py\n```\n\n**目录结构**\n\n```\ncrawler-methods-lab/\n├── target/        fixture_13f.html（靶页）· serve.py（本地服务）\n├── methods/       01–18，每个含 run.py + output/\n├── results/       comparison.csv · comparison.json\n├── docs/          技术文档.md（本文）\n├── common.py      共用的落盘与自检\n├── collect_results.py\n└── run_all.sh\n```\n\n每个方法的 `output/` 里有：`rows.json`（抓到的数据）、`summary.json`（自检摘要）、\n`raw.html`（抓到的原始/渲染后页面）。**对比 01 和 07 的 `raw.html` 是最直观的一课。**\n","requirements":"# 本实验实跑的 12 种方法所需依赖（均已在实验中验证可装可跑）\nrequests\nbeautifulsoup4\nlxml\nhttpx\nselectolax>=1.0          # 注意：必须用 lexbor 后端，modest 已废弃\nscrapy\ncurl_cffi\npandas\nplaywright               # 装完还要: playwright install chromium\ncrawl4ai\nscrapling\nbrowserforge             # scrapling 的隐式依赖，缺了会 ModuleNotFoundError\nmarkitdown\npymupdf\n\n# ── 以下为未执行方法所需，按需安装 ──────────────────────\n# firecrawl-py           # 方法 13，需 FIRECRAWL_API_KEY\n# browser-use            # 方法 14，需 LLM API key\n# docling                # 方法 18，会拉 torch，数 GB\n# 方法 15 Skyvern  → Docker Compose\n# 方法 16 Stagehand → npm install @browserbasehq/stagehand\n# 方法 17 Katana   → go install github.com/projectdiscovery/katana/cmd/katana@latest\n","runall":"#!/usr/bin/env bash\n# 一键复现：起靶站 → 跑所有可执行方法 → 汇总对比表\n#\n#   bash run_all.sh\n#\n# 依赖安装见 requirements.txt。未执行的方法（13–18）需要外部 API key 或运行时，\n# 不在此脚本内，各自目录的 run.py / README.md 里有完整说明。\n\nset -u\ncd \"$(dirname \"$0\")\"\nexport NO_PROXY='*' no_proxy='*'\n\nPORT=8899\necho \"▶ 启动本地靶站 (:$PORT)\"\npython3 target/serve.py $PORT >/tmp/lab_serve.log 2>&1 &\nSERVER=$!\ntrap 'kill $SERVER 2>/dev/null' EXIT\nsleep 2\n\nif ! curl -sS --noproxy '*' -o /dev/null \"http://127.0.0.1:$PORT/fixture_13f.html\"; then\n  echo \"✗ 靶站起不来，退出\"; exit 1\nfi\necho \"✓ 靶站就绪\"\necho\n\nfor m in 01_requests_bs4 02_httpx_selectolax 03_lxml_xpath 04_pandas_read_html \\\n         05_scrapy 06_curl_cffi 07_playwright 08_crawl4ai 09_scrapling \\\n         10_markitdown 11_pymupdf ; do\n  echo \"▶ $m\"\n  timeout 300 python3 \"methods/$m/run.py\" >/dev/null 2>&1 \\\n    && echo \"  ✓\" || echo \"  ✗ 失败（详见 methods/$m/output/）\"\ndone\n\necho \"▶ 12_cli_downloaders\"\ntimeout 120 bash methods/12_cli_downloaders/run.sh >/dev/null 2>&1 \\\n  && echo \"  ✓\" || echo \"  ✗\"\n\necho\necho \"▶ 汇总\"\npython3 collect_results.py\n","zip_file":"crawler-methods-lab.zip","zip_bytes":204634};

function rTDScrape(){
  const zh = S.lang==='zh';
  if(typeof LAB==='undefined'){
    document.getElementById('C').innerHTML = `<div style="max-width:860px">${tdBackLink(zh)}<p style="color:var(--mu)">Lab data unavailable.</p></div>`;
    return;
  }
  const L = (o) => !o ? '' : (zh ? (o.zh||o.en||'') : (o.en||o.zh||''));
  const ms = LAB.methods;
  const run = ms.filter(m=>m.ran);
  const times = run.filter(m=>m.elapsed>0).map(m=>m.elapsed);
  const fastest = Math.min(...times);

  const sectionTitle = (s) => `<div style="font-size:15px;font-weight:900;letter-spacing:-.03em;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--bdr)">${s}</div>`;
  const box = (inner, pad) => `<div style="background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:${pad||'12px 14px'};font-size:12.5px;color:var(--txt2);line-height:1.7">${inner}</div>`;

  // ── speed table, straight from the measured runs ──
  const speedRows = run.filter(m=>m.elapsed>0).sort((a,b)=>a.elapsed-b.elapsed).map(m=>`<tr>
    <td style="padding:6px 10px;border-bottom:1px solid var(--bdr)"><code style="font-size:11px;color:var(--teal);font-weight:700">${esc(m.name)}</code></td>
    <td style="padding:6px 10px;border-bottom:1px solid var(--bdr);color:var(--txt2);font-size:11.5px">${esc(L(m.layer))}</td>
    <td style="padding:6px 10px;border-bottom:1px solid var(--bdr);text-align:right;font-variant-numeric:tabular-nums">${m.elapsed.toFixed(3)} s</td>
    <td style="padding:6px 10px;border-bottom:1px solid var(--bdr);text-align:right;font-weight:800;font-variant-numeric:tabular-nums;color:${m.elapsed/fastest>100?'var(--red)':'var(--txt2)'}">${(m.elapsed/fastest).toFixed(0)}×</td>
    <td style="padding:6px 10px;border-bottom:1px solid var(--bdr);text-align:center;font-weight:800;color:${m.js==='✓'?'var(--grn)':'var(--mu)'}">${esc(m.js)}</td>

function tdDownload(){
  const names=document.getElementById('td-ta').value.split('\n').map(n=>n.trim()).filter(Boolean);
  const cfg={updated:new Date().toISOString().split('T')[0],investors:names};
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='investors_config.json';a.click();
  document.getElementById('td-msg').innerHTML='<div style="margin-top:8px;background:#e8f7ee;border:1px solid #16a34a;border-radius:6px;padding:8px 12px;font-size:12px;color:#15803d">'+(S.lang==='zh'?'已下载。提交到GitHub后触发Actions。':'Downloaded. Commit to GitHub then trigger Actions.')+'</div>';
}

name: Refresh portfolio data

on:
  schedule:
    # Runs every Monday at 09:00 UTC. 13F filings only update quarterly,
    # so weekly is already generous — tighten this if you edit the Notion
    # database more often than that.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}   # lets you click "Run workflow" in the GitHub UI on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run refresh script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/refresh_data.py

      - name: Commit and push if data.json changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- giant-portfolio-tracker/data.json; then
            echo "No changes to data.json — nothing to commit."
          else
            git add giant-portfolio-tracker/data.json
            git commit -m "chore: refresh portfolio data $(date -u +'%Y-%m-%d')"
            git push
          fi
